<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do apostador — banca, PJ e patrimônio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #12151a;
    --bg-elev: #181c22;
    --card: #1b2028;
    --card-hover: #1f242d;
    --line: #2a2f38;
    --line-soft: #22262e;
    --text: #e9ebee;
    --text-dim: #9aa2ac;
    --text-faint: #666e79;
    --teal: #2fb887;
    --teal-dim: #163a2e;
    --teal-text: #6fe0b3;
    --coral: #e07a4f;
    --coral-dim: #3a261c;
    --coral-text: #f0a884;
    --amber: #e0b23f;
    --amber-dim: #3a3018;
    --red: #d9564f;
    --red-dim: #3a2020;
    --chart-blue: #4a90d9;
    --chart-purple: #9b7fd4;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;}
  .app{display:flex;min-height:100vh;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .sidebar{width:220px;flex-shrink:0;background:var(--bg-elev);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);letter-spacing:0.02em;padding:0 8px 4px;}
  .brand-sub{font-size:11px;color:var(--text-faint);padding:0 8px 20px;border-bottom:1px solid var(--line-soft);margin-bottom:14px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;cursor:pointer;color:var(--text-dim);font-size:13px;font-weight:500;margin-bottom:2px;user-select:none;}
  .nav-item:hover{background:var(--card-hover);color:var(--text);}
  .nav-item.active{background:var(--teal-dim);color:var(--teal-text);}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:0.7;}
  .sidebar-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--text-faint);padding-left:8px;}

  .main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1180px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .page-title{font-size:20px;font-weight:600;margin:0 0 4px;}
  .page-sub{font-size:13px;color:var(--text-dim);margin:0;max-width:640px;}

  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:980px){
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .grid-3{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}     /* faltava: no celular os cards de
                                               duas colunas ficavam com ~170px
                                               e o texto todo espremido */
  }
  @media (max-width:600px){
    .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
    .card{padding:14px;}
    .card-num{font-size:22px;}
    .section{margin-bottom:18px;}
    table{font-size:12px;}
  }

  /* ---------- celular ----------
     A sidebar tinha largura fixa de 220px e nunca colapsava: num telefone
     ela comia metade da tela e espremia o conteúdo. Vira gaveta. */
  .menu-btn{display:none;}
  .sidebar-backdrop{display:none;}
  @media (max-width:820px){
    .menu-btn{
      display:flex;align-items:center;justify-content:center;gap:8px;
      position:fixed;top:10px;left:10px;z-index:60;
      width:42px;height:42px;border-radius:10px;
      background:var(--bg-elev);border:1px solid var(--line);
      color:var(--text);font-size:18px;cursor:pointer;
    }
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;z-index:70;
      transform:translateX(-100%);transition:transform .22s ease;
      height:100dvh;width:250px;box-shadow:0 0 30px rgba(0,0,0,.5);
    }
    .app.menu-aberto .sidebar{transform:translateX(0);}
    .app.menu-aberto .sidebar-backdrop{
      display:block;position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.5);
    }
    .main{padding:64px 14px 48px;max-width:100%;}
    .page-title{font-size:19px;}
    .page-head{flex-direction:column;align-items:flex-start;gap:10px;}
    /* botões de topo de página não podem estourar a largura */
    .page-head > div:last-child{display:flex;flex-wrap:wrap;gap:6px;width:100%;}
    .modal{max-height:calc(100dvh - 24px);padding:18px 16px;}
    .modal-overlay{padding:12px;align-items:flex-start;}
    .modal-actions{position:sticky;bottom:-18px;background:var(--bg-elev);
                   padding:12px 0 4px;margin-top:14px;flex-wrap:wrap;}
    .modal-actions .btn{flex:1;min-width:110px;justify-content:center;}
    input,select,textarea{font-size:16px;}   /* evita o zoom automático do iOS */
  }

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .card-title{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);margin:0 0 8px;font-weight:600;}
  .card-num{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;}
  .card-note{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .tag-teal{color:var(--teal-text);}
  .tag-coral{color:var(--coral-text);}
  .tag-amber{color:var(--amber);}
  .tag-red{color:var(--red);}

  .section{margin-top:26px;}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .section-title{font-size:15px;font-weight:600;margin:0;}
  .section-sub{font-size:12px;color:var(--text-faint);margin:2px 0 0;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-faint);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line);}
  th.num,td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:hover{background:var(--card-hover);}
  /* overflow:hidden cortava as colunas da direita no celular sem deixar
     rolar — as últimas colunas ficavam inalcançáveis */
  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;padding:6px 6px 2px;}
  .table-wrap table{min-width:520px;}
  .table-wrap table{margin-top:6px;}

  input, select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px;font-size:13px;font-family:var(--sans);width:100%;}
  input:focus, select:focus{outline:none;border-color:var(--teal);}
  input[type=number]{font-family:var(--mono);}
  .cell-input{background:transparent;border:1px solid transparent;padding:5px 7px;border-radius:6px;width:100%;text-align:right;font-family:var(--mono);}
  .cell-input:hover{border-color:var(--line);}
  .cell-input:focus{background:var(--bg);border-color:var(--teal);}
  .cell-text{width:100%;background:transparent;border:1px solid transparent;padding:5px 7px;border-radius:6px;font-family:var(--sans);font-size:13px;}
  .cell-text:hover{border-color:var(--line);}
  .cell-text:focus{background:var(--bg);border-color:var(--teal);}

  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:500;}
  .field{margin-bottom:12px;}

  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--card-hover);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);}
  .btn:hover{border-color:var(--text-faint);}
  .btn-primary{background:var(--teal);border-color:var(--teal);color:#06231a;font-weight:600;}
  .btn-primary:hover{background:#38cc99;border-color:#38cc99;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);padding:6px 8px;}
  .btn-ghost:hover{color:var(--text);background:var(--card-hover);}
  .btn-danger{color:var(--red);}
  .btn-sm{padding:5px 10px;font-size:12px;}

  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge-teal{background:var(--teal-dim);color:var(--teal-text);}
  .badge-coral{background:var(--coral-dim);color:var(--coral-text);}
  .badge-amber{background:var(--amber-dim);color:var(--amber);}
  .badge-red{background:var(--red-dim);color:var(--red);}
  .badge-gray{background:var(--line-soft);color:var(--text-dim);}

  .bar-track{height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;border-radius:4px;background:var(--coral);}

  .empty{padding:32px 10px;text-align:center;color:var(--text-faint);font-size:13px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(6,8,10,0.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;width:100%;max-width:420px;padding:22px;max-height:90vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:16px;font-weight:600;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  .note-box{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--teal);border-radius:0 8px 8px 0;padding:12px 14px;font-size:12.5px;color:var(--text-dim);}
  .note-box.coral{border-left-color:var(--coral);}
  .note-box.amber{border-left-color:var(--amber);}
  .note-box strong{color:var(--text);}

  .toast{position:fixed;bottom:18px;right:18px;background:var(--card);border:1px solid var(--line);padding:9px 16px;border-radius:8px;font-size:12px;color:var(--text-dim);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;z-index:60;}
  .toast.show{opacity:1;transform:translateY(0);}

  a.link-icon{color:var(--text-faint);text-decoration:none;}
  a.link-icon:hover{color:var(--teal-text);}

  .indic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;}
  @media (max-width:980px){.indic-grid{grid-template-columns:1fr;}}
  .indic-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .indic-card h4{margin:0 0 6px;font-size:13px;font-weight:600;}
  .indic-card p{margin:0;font-size:12.5px;color:var(--text-dim);line-height:1.6;}

  .preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
  @media (max-width:980px){.preview-grid{grid-template-columns:repeat(2,1fr);}}
  .preview-item{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .preview-item .lbl{font-size:10.5px;text-transform:uppercase;color:var(--text-faint);letter-spacing:.04em;}
  .preview-item .val{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:3px;}

  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 26px;}
  .auth-card h2{margin:0 0 4px;font-size:18px;font-weight:600;}
  .auth-card p.sub{margin:0 0 20px;font-size:13px;color:var(--text-dim);}
  .auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;}
  .auth-tab{flex:1;text-align:center;padding:7px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-dim);}
  .auth-tab.active{background:var(--teal-dim);color:var(--teal-text);}
  .auth-error{font-size:12px;color:var(--red);margin-top:10px;min-height:16px;}
  .sidebar-user{font-size:12px;color:var(--text-dim);padding:0 8px;margin-bottom:6px;word-break:break-all;}
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-right:5px;box-shadow:0 0 0 0 rgba(47,184,135,0.6);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,184,135,0.5);}70%{box-shadow:0 0 0 6px rgba(47,184,135,0);}100%{box-shadow:0 0 0 0 rgba(47,184,135,0);}}
</style>
</head>
<body>

<div class="auth-wrap" id="auth-screen" style="display:none">
  <div class="auth-card">
    <h2>Painel do apostador</h2>
    <p class="sub">Seus dados ficam salvos na nuvem, só você tem acesso.</p>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-signin" onclick="setAuthMode('signin')">Entrar</div>
      <div class="auth-tab" id="tab-signup" onclick="setAuthMode('signup')">Criar conta</div>
    </div>
    <div class="field"><label>E-mail</label><input id="auth-email" type="email" placeholder="voce@email.com"></div>
    <div class="field"><label>Senha</label><input id="auth-password" type="password" placeholder="mínimo 6 caracteres"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" id="auth-submit" onclick="submitAuth()">Entrar</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <button class="menu-btn" id="menu-btn" onclick="toggleMenu()" aria-label="Menu">☰</button>
  <div class="sidebar-backdrop" onclick="toggleMenu(false)"></div>
  <div class="sidebar">
    <div class="brand">Painel do apostador</div>
    <div class="brand-sub" id="last-saved"><span class="live-dot"></span>ao vivo</div>
    <div id="nav"></div>
    <div class="sidebar-foot">
      <div class="sidebar-user" id="sidebar-user"></div>
      <button class="btn btn-sm" style="width:100%;justify-content:center;margin-bottom:6px;" onclick="copySyncPrompt()">📋 Copiar comando de sync</button>
      <a class="btn btn-sm" style="width:100%;justify-content:center;display:flex;margin-bottom:10px;" href="claude://claude.ai/new?q=Sincroniza%20meu%20painel%20de%20apostas%3A%20abra%20o%20MeuAssessor%20%28app.meuassessor.com%29%20e%20me%20diga%20o%20saldo%20atual%20das%20contas%20Itau%2C%20Mercado%20Pago%20e%20Nu%20Pagamentos%3B%20abra%20o%20Shark%20Track%20%28dashboard.sharktrack.app%29%20e%20me%20diga%20o%20total%20pendente%20e%20o%20saldo%20financeiro%20atual%3B%20depois%20siga%20a%20skill%20%22sincronizar-painel-apostador%22%20pra%20gravar%20isso%20no%20Supabase.">🖥 Abrir no Claude Desktop</a>
      Dados sincronizam pela nuvem<br>e atualizam sozinhos aqui.
      <span class="btn btn-sm" style="width:100%;justify-content:center;display:flex;margin-top:10px;" onclick="doSignOut()">Sair</span>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SEED_HOUSES = [
  {"id": null, "nome": "Casa A", "usuario": "",        "saldo": 0, "rolando": 0, "deixar": 500,  "link": "https://exemplo-a.bet.br/"},
  {"id": null, "nome": "Casa B", "usuario": "",        "saldo": 0, "rolando": 0, "deixar": 1000, "link": "https://exemplo-b.bet.br/"},
  {"id": null, "nome": "Casa C", "usuario": "",        "saldo": 0, "rolando": 0, "deixar": 250,  "link": "https://exemplo-c.bet.br/"},
  {"id": null, "nome": "Casa A", "usuario": "Perfil 2","saldo": 0, "rolando": 0, "deixar": 500,  "link": "https://exemplo-a.bet.br/"},
  {"id": null, "nome": "Casa B", "usuario": "Perfil 2","saldo": 0, "rolando": 0, "deixar": 1000, "link": "https://exemplo-b.bet.br/"}
];

// ==== CONFIGURE AQUI: dados do seu projeto Supabase (veja README.md) ====
const SUPABASE_URL = 'https://SEUPROJETO.supabase.co';
const SUPABASE_ANON_KEY = 'COLE_AQUI_SUA_CHAVE_ANON';
// ==========================================================================
const sb = SUPABASE_URL.startsWith('http') ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const DEFAULT_STATE = {
  houses: [],
  pjHistory: [],
  provisionLedger: [],
  patrimonio: [],
  reservas: [],
  movimentacoes: [],
  snapshots: [],
  settings: {
    despesaMensalPF: 6000,
    percentIRPF: 15,
    percentScam: 5,
    percentRetirada: 50,
    mesesReserva: 6,
    saldoOperacional: 0,
    instituicaoOperacional: 'Mercado Pago',
    instituicaoProvisionamento: 'Privilege DI - Itaú (a definir)',
    diaSaque: 30
  }
};

DEFAULT_STATE.houses = SEED_HOUSES.map((h, i) => ({ status:'ativa', verificadoEm: hojeLocal(), notas:'', ...h, id: 'seed_' + i }));
DEFAULT_STATE.reservas = [{ id:'default-reserva', nome:'Reserva de emergência', instituicao:'', valor: 0 }];
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let activeTab = 'visao';
let loaded = false;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = (v) => (v || v === 0 ? Number(v) : 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtNum = (v) => (v || v === 0 ? Number(v) : 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const SYNC_PROMPT = "Sincroniza meu painel de apostas: abra o MeuAssessor (app.meuassessor.com) e me diga o saldo atual das contas Itaú, Mercado Pago e Nu Pagamentos; abra o Shark Track (dashboard.sharktrack.app) e me diga o total pendente e o saldo financeiro atual; depois siga a skill \"sincronizar-painel-apostador\" pra gravar isso no Supabase.";
function copySyncPrompt(){
  const done = () => showToast('Comando copiado — cole numa aba do Claude.');
  const fail = () => showToast('Não consegui copiar automaticamente. Comando: ' + SYNC_PROMPT);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(SYNC_PROMPT).then(done).catch(fail);
  } else {
    fail();
  }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

let currentUser = null;
let realtimeChannel = null;

async function loadState(){
  if(!sb){ showToast('Configure SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo.'); return; }
  try{
    const { data, error } = await sb.from('app_state').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    state = (data && data.data) ? data.data : JSON.parse(JSON.stringify(DEFAULT_STATE));
  }catch(e){
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
  migrateState();
  loaded = true;
  document.getElementById('last-saved').innerHTML = '<span class="live-dot"></span>ao vivo';
  renderNav();
  renderMain();
}
function migrateState(){
  if(!Array.isArray(state.reservas)){
    const legacyValor = Number(state.settings && state.settings.reservaAtual) || 0;
    state.reservas = legacyValor > 0 ? [{ id: uid(), nome:'Reserva de emergência', instituicao: (state.settings && state.settings.instituicaoReserva) || '', valor: legacyValor }] : [];
  }
  if(!Array.isArray(state.movimentacoes)) state.movimentacoes = [];
  if(!state.settings) state.settings = {};
  if(!state.settings.operaPortas) state.settings.operaPortas = {};
  if(!Array.isArray(state.assinaturas)) state.assinaturas = [];
  if(!state.settings.pessoasPerfil) state.settings.pessoasPerfil = {...PESSOAS_PERFIL_PADRAO};
  if(!Array.isArray(state.aReceber)) state.aReceber = [];
  if(!Array.isArray(state.recorrencias)) state.recorrencias = [];
  if(!state.settings.metaOperacional) state.settings.metaOperacional = 20000;
  if(!state.settings.faixaIsencaoIR) state.settings.faixaIsencaoIR = 28467.20;
  // normaliza valores que possam ter vindo como texto
  state.houses.forEach(h => {
    h.saldo = paraNumero(h.saldo);
    h.rolando = paraNumero(h.rolando);
    h.deixar = paraNumero(h.deixar);
    if(Array.isArray(h.historico)) h.historico.forEach(p => { p.saldo = paraNumero(p.saldo); });
  });
  (state.movimentacoes||[]).forEach(mv => { mv.valor = paraNumero(mv.valor); });
  (state.pjHistory||[]).forEach(h => { h.dataFechamento = paraISO(h.dataFechamento); });
  if(!Array.isArray(state.snapshots)) state.snapshots = [];
}

async function saveState(){
  captureSnapshotIfNeeded();
  if(!sb || !currentUser) return;

    const { error } = await sb.from('app_state').upsert({ user_id: currentUser.id, data: state, updated_at: new Date().toISOString(), updated_by: 'painel' });

  }catch(e){
    showToast('Erro ao salvar os dados na nuvem.');
  }
}

let authMode = 'signin';
function setAuthMode(mode){
  authMode = mode;
  document.getElementById('tab-signin').classList.toggle('active', mode==='signin');
  document.getElementById('tab-signup').classList.toggle('active', mode==='signup');

async function submitAuth(){
  if(!sb){ document.getElementById('auth-error').textContent = 'Configure o Supabase no topo do arquivo primeiro.'; return; }
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;

  errEl.textContent = '';
  if(!email || password.length < 6){ errEl.textContent = 'E-mail válido e senha com 6+ caracteres.'; return; }
  try{
    if(authMode === 'signin'){
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
    } else {

      if(error) throw error;

      errEl.textContent = 'Conta criada. Se pedir confirmação, confira seu e-mail e depois entre.';

async function doSignOut(){

  currentUser = null;

async function enterApp(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return;
  currentUser = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('sidebar-user').textContent = user.email;

}
function subscribeRealtime(){
  if(!sb || !currentUser) return;
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('app_state_changes')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_state', filter:`user_id=eq.${currentUser.id}` }, (payload) => {
      if(payload.new && payload.new.updated_by && payload.new.updated_by !== 'painel'){
        state = payload.new.data;
        migrateState();
        renderNav();
        renderMain();
        showToast(payload.new.updated_by === 'saldos'
          ? 'Saldos das casas atualizados pelo saldos.py.'
          : 'Painel atualizado — Claude acabou de sincronizar.');

    })

}
async function initAuth(){
  if(!sb){
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('auth-error').textContent = 'Configure SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo.';

function captureSnapshotIfNeeded(){
  const today = hojeLocal();
  const last = state.snapshots[state.snapshots.length-1];
  if(last && last.data === today){
    last.total = patrimonioLiquidoGeral();
    last.banca = bancaTotal();
    last.operacional = Number(state.settings.saldoOperacional)||0;
    last.provisionamento = provisionSaldo();
    last.reserva = reservaTotal();
    last.patrimonio = patrimonioTotal();
    return;
  }
  state.snapshots.push({
    data: today,
    total: patrimonioLiquidoGeral(),
    banca: bancaTotal(),
    operacional: Number(state.settings.saldoOperacional)||0,
    provisionamento: provisionSaldo(),
    reserva: reservaTotal(),
    patrimonio: patrimonioTotal()
  });
  if(state.snapshots.length > 180) state.snapshots.shift();
}

// ---------- derived values ----------
// Apostas em aberto deixaram de ser controladas casa a casa: o Shark Track
// já sabe o total e mantê-lo em 260 células só gerava campo desatualizado.
function pendentesGlobais(){ return paraNumero(state.settings.pendentesShark); }
function saldoNasCasas(){ return state.houses.filter(h=>h.status!=='encerrada').reduce((s,h)=>s + paraNumero(h.saldo), 0); }
function bancaTotal(){ return saldoNasCasas() + pendentesGlobais(); }
function bancaDeixarTotal(){ return state.houses.filter(h=>h.status!=='encerrada').reduce((s,h)=>s + (Number(h.deixar)||0), 0); }
function houseStatus(h){
  if(h.status === 'encerrada') return 'encerrada';
  if(h.status === 'observar') return 'observar';
  const dif = (Number(h.saldo)||0) - (Number(h.deixar)||0);
  if(dif > 0.5) return 'sacar';
  if(dif < -0.5) return 'depositar';
  return 'ok';
}
// Data LOCAL, não UTC. `new Date().toISOString()` devolve o dia em UTC —
// em São Paulo (UTC-3), tudo feito depois das 21h era gravado com a data de
// amanhã. Como o saldos.py grava a data local, a mesma varredura virava dois
// dias diferentes: dois pontos no histórico, variação falsa, e depósito
// caindo fora da janela da conciliação.
function hojeLocal(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dataLocal(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// dd/mm/aaaa -> aaaa-mm-dd. Os fechamentos antigos foram gravados no formato
// brasileiro, e `new Date('07/08/2026')` em JS vira 8 de JULHO (formato
// americano) — ou Invalid Date se o dia passar de 12. Isso bagunçava a ordem
// da lista de atividades.
function paraISO(data){
  if(!data) return '';
  const br = String(data).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return br ? `${br[3]}-${br[2]}-${br[1]}` : String(data).slice(0,10);
}
function formatarData(iso){
  const d = paraISO(iso);
  return d && d.includes('-') ? d.split('-').reverse().join('/') : (iso||'');
}
function daysSince(dateStr){
  if(!dateStr) return Infinity;
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return Infinity;
  // nunca negativo: datas gravadas em UTC antes desta correção ficaram
  // um dia no futuro e apareciam como "há -1 dia(s)"
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
}

// Aceita número ou texto ("1.234,56", "R$ 50,00") — planilha importada e
// edições antigas deixaram saldos como string, e Number() nesses casos dava
// NaN, ou seja, a casa aparecia zerada no painel mesmo tendo dinheiro.
function paraNumero(v){
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v ?? '').replace(/[^\d,.-]/g,'').trim();
  if(!s) return 0;
  if(s.includes(',') && s.includes('.')){
    s = s.lastIndexOf(',') > s.lastIndexOf('.')
      ? s.replace(/\./g,'').replace(',','.')
      : s.replace(/,/g,'');
  } else if(s.includes(',')){
    s = s.replace(',','.');
  } else {
    const p = s.split('.');
    if(p.length > 1 && p[p.length-1].length === 3) s = p.join('');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function housesToReview(){
  return state.houses.filter(h => h.status!=='encerrada' && (h.status==='observar' || daysSince(h.verificadoEm) > 60));
}
function provisionSaldo(){
  const contrib = state.pjHistory.reduce((s,h)=> s + (h.provIRPF||0) + (h.provScam||0), 0);
  const usado = state.provisionLedger.reduce((s,l)=> s + (Number(l.valor)||0), 0);
  return contrib - usado;
}
function reservaMeta(){ return despesaMensalPF() * (Number(state.settings.mesesReserva)||0); }
function reservaTotal(){ return state.reservas.reduce((s,r)=> s + (Number(r.valor)||0), 0); }
// `liquido: true` = dinheiro que dá pra usar amanhã (conta, poupança, CDB
// com liquidez diária). O resto é bem ou investimento travado. A distinção
// importa: ter R$ 300 mil num imóvel não é o mesmo que ter em conta.
const TIPOS_PATRIMONIO = [
  { id:'conta',      nome:'Conta bancária',       icone:'🏦', liquido:true  },
  { id:'poupanca',   nome:'Poupança / CDB diário',icone:'💰', liquido:true  },
  { id:'rendafixa',  nome:'Renda fixa',           icone:'📄', liquido:false },
  { id:'fundo',      nome:'Fundo de investimento',icone:'📊', liquido:false },
  { id:'acoes',      nome:'Ações / FII',          icone:'📈', liquido:false },
  { id:'cripto',     nome:'Cripto',               icone:'🪙', liquido:false },
  { id:'imovel',     nome:'Imóvel',               icone:'🏠', liquido:false },
  { id:'veiculo',    nome:'Veículo',              icone:'🚗', liquido:false },
  { id:'previdencia',nome:'Previdência',          icone:'🛡',  liquido:false },
  { id:'outro',      nome:'Outro',                icone:'•',  liquido:false },
];
function tipoPatrimonio(id){
  // aceita os rótulos antigos, salvos por extenso antes dos ids existirem
  const achado = TIPOS_PATRIMONIO.find(t => t.id === id || t.nome === id);
  return achado || TIPOS_PATRIMONIO[TIPOS_PATRIMONIO.length-1];
}
function patrimonioTotal(){ return state.patrimonio.reduce((s,p)=> s + (Number(p.valor)||0), 0); }
function patrimonioLiquidoDisponivel(){
  return state.patrimonio.filter(p => tipoPatrimonio(p.tipo).liquido)
    .reduce((s,p)=> s + paraNumero(p.valor), 0);
}

// ---------- projeção de patrimônio ----------
// Modelo simples de propósito: cada mês soma o que entra e subtrai o que sai.
// Não tenta prever variância de aposta nem rendimento composto — a graça é
// comparar cenários ("e se eu desligar o salário?"), não acertar o número.
let projDesligados = new Set();      // ids de itens desligados no cenário
let projMeses = 12;

function resultadoMensalApostas(){
  if(state.settings.projResultadoManual != null && state.settings.projResultadoManual !== '')
    return paraNumero(state.settings.projResultadoManual);
  // média do que o Shark Track registrou; se não houver, usa os fechamentos
  const meses = Object.values(state.settings.sharkPorMes || {})
    .map(m => paraNumero(m.resultado)).filter(v => v !== 0);
  if(meses.length) return meses.reduce((s,v)=>s+v,0) / meses.length;
  const hist = (state.pjHistory||[]).map(h => paraNumero(h.lucro)).filter(v => v !== 0);
  if(hist.length) return hist.reduce((s,v)=>s+v,0) / hist.length;
  return 0;
}

function itensProjecao(){
  const itens = [
    { id:'apostas', nome:'Resultado das apostas', grupo:'Operação',
      valor: resultadoMensalApostas(), tipo:'entrada', nota:'média por mês' },
  ];
  recorrenciasAtivas().forEach(r => itens.push({
    id:'rec:'+r.id, nome:r.nome, grupo:'Vida pessoal',
    valor: paraNumero(r.valor), tipo:r.tipo, nota:r.variavel?'varia':(r.dia?`dia ${r.dia}`:'')
  }));
  assinaturas().filter(a => a.ativo !== false).forEach(a => itens.push({
    id:'ass:'+a.id, nome:a.nome, grupo:'Custo da operação',
    valor: paraNumero(a.valor), tipo:'saida', nota:a.dia?`dia ${a.dia}`:''
  }));
  const ir = ganhoAnualPorPerfil().reduce((s,l)=> s + l.imposto, 0) / 12;
  if(ir > 0) itens.push({ id:'imposto', nome:'IRPF provisionado', grupo:'Operação',
                          valor: ir, tipo:'saida', nota:'estimado, por mês' });
  return itens;
}

function fluxoMensal(desligados){
  const fora = desligados || new Set();
  return itensProjecao().filter(i => !fora.has(i.id))
    .reduce((s,i)=> s + (i.tipo === 'entrada' ? i.valor : -i.valor), 0);
}

function projetar(meses, desligados){
  const inicio = patrimonioLiquidoGeral();
  const passo = fluxoMensal(desligados);
  const serie = [];
  for(let m = 0; m <= meses; m++) serie.push(inicio + passo * m);
  return { serie, inicio, passo, fim: serie[serie.length-1] };
}

// Quantos meses a reserva aguenta se o fluxo virar negativo
function mesesDeFolego(passo){
  if(passo >= 0) return null;
  const colchao = reservaTotal() + paraNumero(state.settings.saldoOperacional);
  return Math.floor(colchao / Math.abs(passo));
}

function toggleProjecao(id){
  if(projDesligados.has(id)) projDesligados.delete(id);
  else projDesligados.add(id);
  renderMain();
}
function setProjMeses(n){ projMeses = Number(n)||12; renderMain(); }

  const marcos = [3, 6, 12, 24].filter(m => m <= projMeses || m === projMeses);
  const tabela = marcos.map(m => {

      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px;">
        <span>em ${m} ${m===1?'mês':'meses'}</span>
        <span>
          <span class="${v>=cen.inicio?'tag-teal':'tag-coral'}">${fmt(v)}</span>

        </span>

  return `
    <div class="page-head">
      <div>
        <p class="page-title">Projeção</p>

      </div>
    </div>

    <div class="section">
      <div class="grid grid-3">
        <div class="card">
          <p class="card-title">Fluxo por mês${mudou?' (cenário)':''}</p>
          <p class="card-num ${cen.passo>=0?'tag-teal':'tag-coral'}">${cen.passo>=0?'+':'−'}${fmt(Math.abs(cen.passo))}</p>
          <p class="card-note">${mudou?`base era ${base.passo>=0?'+':'−'}${fmt(Math.abs(base.passo))}`:'entra menos sai, todo mês'}</p>
        </div>
        <div class="card">
          <p class="card-title">Patrimônio em ${projMeses} meses</p>
          <p class="card-num">${fmt(cen.fim)}</p>

          ${linhas}
        </div>

              ? `Fixado por você. <a href="#" onclick="event.preventDefault();updateSetting('projResultadoManual','');renderMain()" style="color:var(--teal)">voltar à média</a>`
              : 'Média dos meses registrados no Shark Track.'}</p>

            <strong>Leia como cenário, não previsão.</strong><br>

            resultado de apostas, mesmas contas, sem imprevisto e sem rendimento.

        </div>

}

// ---------- entradas e saídas fixas da vida pessoal (PF) ----------
// Salário, FII, aluguel, fatura de cartão. Diferente de `assinaturas`, que é
// custo da OPERAÇÃO e entra como despesa no fechamento PJ. Aqui é vida
// pessoal: define quanto você precisa por mês e, portanto, a meta da reserva.
// Categorias de gasto. `fixo:false` = o valor muda todo mês (faturas de
// cartão), e por isso ganha bloco separado: uma fatura de R$ 2.300 não é
// "custo fixo", é a soma de gastos que você já fez.
const CATEGORIAS = [
  { id:'moradia',    nome:'Moradia',        icone:'🏠', fixo:true  },
  { id:'saude',      nome:'Saúde',          icone:'🩺', fixo:true  },
  { id:'educacao',   nome:'Educação',       icone:'🎓', fixo:true  },
  { id:'assinatura', nome:'Assinaturas',    icone:'📺', fixo:true  },
  { id:'transporte', nome:'Transporte',     icone:'⛽', fixo:true  },
  { id:'pessoal',    nome:'Pessoal',        icone:'✂️', fixo:true  },
  { id:'cartao',     nome:'Fatura de cartão',icone:'💳', fixo:false },
  { id:'outro',      nome:'Outros',         icone:'•',  fixo:true  },
];
function categoria(id){ return CATEGORIAS.find(c => c.id === id) || CATEGORIAS[CATEGORIAS.length-1]; }

// Adivinha a categoria pelo nome, pra não te obrigar a classificar tudo à mão
const PISTAS_CATEGORIA = [
  [/fatura|cart[aã]o|nubank|ita[uú]|visa|master/i, 'cartao'],
  [/gasolina|combust[ií]vel|uber|estacionamento|ipva|ped[aá]gio/i, 'transporte'],
  [/aluguel|condom[ií]nio|iptu|luz|[aá]gua|energia|internet|g[aá]s\b/i, 'moradia'],
  [/plano de sa[uú]de|m[eé]dic|dentist|nutricion|terapia|psic[oó]log|farm[aá]cia|monjauro|remedi|academia|personal/i, 'saude'],
  [/faculdade|curso|escola|mensalidade|p[oó]s|ingl[eê]s/i, 'educacao'],
  [/netflix|spotify|prime|disney|hbo|max|youtube|claude|chatgpt|assinatura|streaming|icloud/i, 'assinatura'],
  [/seguro do carro|revis[aã]o do carro/i, 'transporte'],
  [/barbeiro|cabelo|roupa|salão|sal[aã]o|manicure/i, 'pessoal'],
];
function categoriaSugerida(nome){
  for(const [re, id] of PISTAS_CATEGORIA) if(re.test(nome||'')) return id;
  return 'outro';
}

function recorrencias(){
  if(!Array.isArray(state.recorrencias)) state.recorrencias = [];
  // itens antigos não tinham categoria: classifica pelo nome uma vez
  state.recorrencias.forEach(r => { if(!r.categoria) r.categoria = categoriaSugerida(r.nome); });
  return state.recorrencias;
}
function saidasPorTipo(fixo){
  return recorrenciasAtivas('saida').filter(r => categoria(r.categoria).fixo === fixo);
}
function totalPorTipo(fixo){
  return saidasPorTipo(fixo).reduce((s,r)=> s + paraNumero(r.valor), 0);
}
function totalPorCategoria(){
  const mapa = {};
  recorrenciasAtivas('saida').forEach(r => {
    const c = categoria(r.categoria);
    mapa[c.id] = mapa[c.id] || { ...c, total:0, itens:0 };
    mapa[c.id].total += paraNumero(r.valor);
    mapa[c.id].itens++;
  });
  return Object.values(mapa).sort((a,b)=> b.total - a.total);
}
function recorrenciasAtivas(tipo){
  return recorrencias().filter(r => r.ativo !== false && (!tipo || r.tipo === tipo));
}
function totalRecorrente(tipo){
  return recorrenciasAtivas(tipo).reduce((s,r)=> s + paraNumero(r.valor), 0);
}
function sobraMensalPF(){ return totalRecorrente('entrada') - totalRecorrente('saida'); }

// Despesa mensal usada na meta da reserva: soma as saídas cadastradas, mas
// respeita o valor manual se você preferir fixar.
function despesaMensalPF(){
  if(state.settings.despesaManual) return paraNumero(state.settings.despesaMensalPF);
  const somadas = totalRecorrente('saida');
  return somadas > 0 ? somadas : paraNumero(state.settings.despesaMensalPF);
}

function proximosRecorrentes(dias){
  const hoje = new Date();
  const diaHoje = hoje.getDate();
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
  return recorrenciasAtivas().filter(r => r.dia).map(r => {
    const dia = Math.min(paraNumero(r.dia) || 1, ultimoDia);
    let faltam = dia - diaHoje;
    if(faltam < 0) faltam += ultimoDia;
    return { ...r, dia, faltam };
  }).filter(r => r.faltam <= (dias || 5)).sort((a,b) => a.faltam - b.faltam);
}

      </div>
      <div class="bar-track" style="margin-top:4px;height:4px;"><div class="bar-fill" style="width:${Math.round(c.total/totalCat*100)}%;background:var(--coral)"></div></div>
    </div>`).join('');

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">

      ${bloco(`Gasto variável`, fmt(totalVar), variaveis, 'Nenhuma fatura cadastrada.')}

      ${cats.length > 1 ? `

function salvarRecorrencia(id){
  const nome = document.getElementById('rc-nome').value.trim();

function aReceber(){
  if(!Array.isArray(state.aReceber)) state.aReceber = [];
  return state.aReceber;
}
function aReceberAbertos(){ return aReceber().filter(r => !r.recebidoEm); }
function aReceberTotal(){
  return aReceberAbertos().reduce((s,r)=> s + paraNumero(r.valor), 0);
}

  const hoje = hojeLocal();
  return aReceberAbertos().filter(r => r.previsto && r.previsto < hoje);
}

  const comData = aReceberAbertos().filter(r => r.previsto).sort((a,b)=> a.previsto.localeCompare(b.previsto));

function mediaLucroLiquido(n){
  const hist = state.pjHistory.slice(-n);

}

// Proxy, antidetect, Shark Track, MeuAssessor... tudo isso é despesa do mês
// que hoje você digita de memória no fechamento.
function assinaturas(){
  if(!Array.isArray(state.assinaturas)) state.assinaturas = [];
  return state.assinaturas;
}
function custoMensal(){
  return assinaturas().filter(a => a.ativo !== false)
    .reduce((s,a) => s + paraNumero(a.valor), 0);
}
function proximosVencimentos(dias){
  const hoje = new Date();
  const diaHoje = hoje.getDate();
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
  return assinaturas().filter(a => a.ativo !== false && a.dia).map(a => {
    const dia = Math.min(paraNumero(a.dia) || 1, ultimoDia);
    let faltam = dia - diaHoje;
    if(faltam < 0) faltam += ultimoDia;      // já passou: cai no mês que vem
    return { ...a, dia, faltam };
  }).filter(a => a.faltam <= (dias || 5)).sort((a,b) => a.faltam - b.faltam);
}

// Casa limitada é dinheiro parado: pode ter R$ 2.000 e só aceitar R$ 15 de

function estaLimitada(h){ return !!h.limitada; }
function stakeAceito(h){ return paraNumero(h.stakeMax); }
function capacidadeReal(){
  const ativas = state.houses.filter(h => (h.status||'ativa') !== 'encerrada');
  const total = ativas.reduce((s,h)=> s + paraNumero(h.saldo), 0);
  const limitadas = ativas.filter(estaLimitada);
  const presa = limitadas.reduce((s,h)=> s + paraNumero(h.saldo), 0);
  return { total, presa, livre: total - presa, nLimitadas: limitadas.length, nTotal: ativas.length, limitadas };
}

  const pct = c.total ? Math.round(c.livre/c.total*100) : 0;
  const piores = c.limitadas
    .filter(h => paraNumero(h.saldo) > 0)
    .sort((a,b) => (paraNumero(b.saldo)) - (paraNumero(a.saldo)))
    .slice(0,6)
    .map(h => `

// ---------- rodízio: contas paradas ----------
// Conta sem movimento é conta que fecha sozinha ou pede documento do nada.
// Melhor rodar dinheiro por ela de vez em quando do que deixar dormindo.
function contasParadas(dias){
  const limite = dias || 45;
  return state.houses.filter(h => {
    if((h.status||'ativa') === 'encerrada' || estaLimitada(h)) return false;
    if(paraNumero(h.saldo) <= 0.005) return false;
    const hist = Array.isArray(h.historico) ? h.historico : [];
    if(hist.length >= 3){
      const ults = hist.slice(-3).map(p => paraNumero(p.saldo));
      if(ults.every(v => Math.abs(v - ults[0]) < 0.005)) return true;
    }
    const movs = (state.movimentacoes||[]).filter(mv => mv.casaId === h.id);
    const ultimoMov = movs.length ? movs.map(mv=>mv.data).sort().pop() : null;
    return daysSince(ultimoMov || h.criadaEm || h.verificadoEm) > limite;
  }).sort((a,b) => paraNumero(b.saldo) - paraNumero(a.saldo));
}
function renderRodizioCard(){
  const paradas = contasParadas(45);
  if(paradas.length < 2) return '';
  const linhas = paradas.slice(0,6).map(h => `
    <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line-soft);font-size:13px;">

      <span class="tag-teal">${fmt(paraNumero(h.saldo))}</span>
    </div>`).join('');
  const total = paradas.reduce((s,h)=> s + paraNumero(h.saldo), 0);
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <p class="card-title">Use estas nas próximas apostas</p>
          <p style="font-size:13px;color:var(--text-dim);margin:0 0 10px;max-width:420px;">
            ${paradas.length} conta(s) com ${fmt(total)} sem movimento há mais de 45 dias.
            Conta parada tende a pedir documento ou encerrar — vale girar um pouco por elas.
          </p>
        </div>
      </div>
      <div>${linhas}</div>
      ${paradas.length > 6 ? `<p class="card-note" style="margin-top:8px;">+ ${paradas.length-6} outra(s)</p>` : ''}

// ---------- variação entre varreduras ----------
// O saldos.py grava um ponto por dia em h.historico. Comparar os dois
// últimos pontos mostra o que a varredura de hoje revelou.
function variacaoCasa(h){
  const hist = Array.isArray(h.historico) ? h.historico : [];
  if(hist.length < 2) return null;
  const atual = Number(hist[hist.length-1].saldo)||0;
  const anterior = Number(hist[hist.length-2].saldo)||0;
  return { anterior, atual, dif: atual - anterior, de: hist[hist.length-2].data, ate: hist[hist.length-1].data };
}
// Variação de saldo NÃO é lucro: depositar R$ 500 numa casa faz o saldo
// subir sem você ter ganhado nada. Como cada depósito/saque já é gravado
// em movimentacoes com casaId, dá pra descontar e chegar no resultado real.
function fluxoCasaNoPeriodo(casaId, de, ate){
  let depositos = 0, saques = 0;
  (state.movimentacoes||[]).forEach(mv => {
    if(mv.casaId !== casaId) return;
    const d = mv.data;
    if(!d || d <= de || d > ate) return;     // (de, ate]
    const v = Number(mv.valor)||0;
    if(mv.tipo === 'deposito_casa') depositos += Math.abs(v);
    else if(mv.tipo === 'saque_casa') saques += Math.abs(v);
  });
  return { depositos, saques };
}
function resultadoCasa(h){
  const v = variacaoCasa(h);
  if(!v) return null;
  const f = fluxoCasaNoPeriodo(h.id, v.de, v.ate);
  return { ...v, ...f, resultado: v.dif - f.depositos + f.saques,
           temFluxo: (f.depositos + f.saques) > 0.005 };
}
function resultadoPeriodo(casas, diasAtras){
  // resultado somado no intervalo, para o ranking de casas
  const limite = new Date(); limite.setDate(limite.getDate() - diasAtras);
  const de = dataLocal(limite);
  return casas.map(h => {
    const hist = (Array.isArray(h.historico)?h.historico:[]).filter(p => p.data >= de);
    if(hist.length < 2) return null;
    const dif = (Number(hist[hist.length-1].saldo)||0) - (Number(hist[0].saldo)||0);
    const f = fluxoCasaNoPeriodo(h.id, hist[0].data, hist[hist.length-1].data);
    return { casa:h, resultado: dif - f.depositos + f.saques, ...f, leituras: hist.length };
  }).filter(Boolean);
}
function variacaoGeral(casas){
  const vars = casas.map(variacaoCasa).filter(Boolean);
  if(!vars.length) return null;
  return {
    total: vars.reduce((s,v)=>s+v.dif, 0),
    subiram: vars.filter(v=>v.dif > 0.005).length,
    cairam: vars.filter(v=>v.dif < -0.005).length,
    casas: vars.length
  };
}
function renderVariacaoCard(){
  const ativas = state.houses.filter(h => (h.status||'ativa') !== 'encerrada');
  const res = ativas.map(h => ({h, r: resultadoCasa(h)})).filter(x => x.r);
  if(!res.length) return '';
  const bruto = res.reduce((s,x)=> s + x.r.dif, 0);
  const liquido = res.reduce((s,x)=> s + x.r.resultado, 0);
  const depositos = res.reduce((s,x)=> s + x.r.depositos, 0);
  const saques = res.reduce((s,x)=> s + x.r.saques, 0);
  const houveFluxo = (depositos + saques) > 0.005;

  const detalhes = res.filter(x => Math.abs(x.r.resultado) > 0.005)
    .sort((a,b) => Math.abs(b.r.resultado) - Math.abs(a.r.resultado)).slice(0,6);
  const linhas = detalhes.map(({h,r}) => `
    <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line-soft);font-size:13px;">
      <span>${escHtml(h.nome)}<span style="color:var(--text-faint)"> · ${escHtml(nomePerfil(h.usuario))}</span>${r.temFluxo?'<span title="houve depósito/saque no período" style="color:var(--text-faint)"> ⇄</span>':''}</span>
      <span class="${r.resultado>0?'tag-teal':'tag-coral'}">${r.resultado>0?'+':'−'}${fmt(Math.abs(r.resultado))}</span>
    </div>`).join('') || '<p class="card-note">Nenhuma casa mudou de resultado entre as duas últimas leituras.</p>';

  return `
    <div class="card">
      <p class="card-title">Resultado desde a varredura anterior</p>
      <p class="card-num ${liquido>=0?'tag-teal':'tag-coral'}">${liquido>=0?'+':'−'}${fmt(Math.abs(liquido))}</p>
      <p class="card-note">${houveFluxo
        ? `saldo mexeu ${bruto>=0?'+':'−'}${fmt(Math.abs(bruto))}, mas ${fmt(depositos)} foi depósito e ${fmt(saques)} saiu em saque`
        : `${res.filter(x=>x.r.dif>0.005).length} casa(s) subiram · ${res.filter(x=>x.r.dif<-0.005).length} caíram · sem depósitos no período`}</p>
      <div style="margin-top:10px;">${linhas}</div>
    </div>`;
}
function renderLucroCasasCard(){

// ---------- rotina semanal de varredura ----------
function ultimaVarredura(casas){
  const datas = casas.map(h => h.verificadoEm).filter(Boolean).sort();
  return datas.length ? datas[datas.length-1] : null;
}
function statusVarredura(perfil){
  const casas = perfil.casas.filter(h => ['ativa','zerada'].includes(tipoCasa(h)));
  const ultima = ultimaVarredura(casas);
  const cadencia = Number(state.settings.diasVarredura)||7;
  const dias = ultima ? daysSince(ultima) : null;
  const aVarrer = casas.filter(h => tipoCasa(h)==='ativa').length;
  const novas = perfil.casas.filter(h => tipoCasa(h)==='nova').length;
  let estado = 'nunca';
  if(dias !== null) estado = dias > cadencia ? 'atrasado' : (dias === cadencia ? 'hoje' : 'ok');
  return { ...perfil, ultima, dias, estado, aVarrer, novas, cadencia };
}
function renderRotinaCard(){
  const cadencia = Number(state.settings.diasVarredura)||7;

  const totalCasas = perfis.reduce((s,p)=>s+p.aVarrer,0);

    const txt = p.dias === null ? 'nunca varrido'

function renderHistoricoCasa(h){
  const hist = Array.isArray(h.historico) ? h.historico.slice(-8) : [];
  if(hist.length < 2) return '';
  const vals = hist.map(p => Number(p.saldo)||0);
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const faixa = (max - min) || 1;
  const barras = hist.map((p,i) => {
    const alt = 6 + Math.round(30 * (vals[i] - min) / faixa);
    const ant = i > 0 ? vals[i-1] : vals[i];
    const cor = vals[i] > ant ? 'var(--teal)' : vals[i] < ant ? 'var(--coral)' : 'var(--text-faint)';
    return `<div title="${p.data}: ${fmt(vals[i])}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;">
      <div style="width:70%;height:${alt}px;background:${cor};border-radius:2px;"></div>
      <span style="font-size:9px;color:var(--text-faint);">${(p.data||'').slice(8,10)}/${(p.data||'').slice(5,7)}</span>
    </div>`;
  }).join('');
  const dif = vals[vals.length-1] - vals[0];
  return `
    <div class="field">
      <label>Histórico de saldo — ${hist.length} leitura(s), ${dif>=0?'+':'−'}${fmt(Math.abs(dif))} no período</label>

}

function sparklineSvg(values, w, h){
  w = w||560; h = h||46;
  if(values.length < 2) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const stepX = w / (values.length-1);
  const pts = values.map((v,i) => `${(i*stepX).toFixed(1)},${(h - ((v-min)/range)*(h-6) - 3).toFixed(1)}`).join(' ');
  const up = values[values.length-1] >= values[0];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${up?'var(--teal)':'var(--coral)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function donutSvg(segments, size){
  size = size || 160;
  const total = segments.reduce((s,seg)=>s+Math.max(seg.value,0), 0);
  const r = size/2 - 14;
  const cx = size/2, cy = size/2;
  const circ = 2 * Math.PI * r;
  if(total <= 0){
    return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="20"/></svg>`;
  }
  let offset = 0;
  const circles = segments.filter(s=>s.value>0).map(seg => {
    const frac = seg.value/total;
    const dash = frac*circ;
    const gap = circ-dash;
    const rot = (offset/total)*360 - 90;
    offset += seg.value;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="20" stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${cx} ${cy})"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;">${circles}</svg>`;
}

function computeAlerts(){
  const alerts = [];
  const now = new Date();
  const dia = Number(state.settings.diaSaque)||30;
  if(!fechamentoDoMesAtual() && (now.getDate() - dia) > 0){
    alerts.push({level:'red', text:`Fechamento de ${MESES[now.getMonth()]} está atrasado (previsto pro dia ${dia}).`});
  }
  const reserva = reservaTotal(), meta = reservaMeta();
  if(meta>0 && reserva < meta*0.5){
    alerts.push({level:'red', text:`Reserva de emergência abaixo de 50% da meta (${fmt(reserva)} de ${fmt(meta)}).`});
  } else if(meta>0 && reserva < meta){
    alerts.push({level:'amber', text:`Reserva de emergência abaixo da meta (${fmt(reserva)} de ${fmt(meta)}).`});
  }
  const pendDeposito = state.houses.filter(h=>houseStatus(h)==='depositar').reduce((s,h)=> s + ((Number(h.deixar)||0)-(Number(h.saldo)||0)), 0);
  const op = Number(state.settings.saldoOperacional)||0;
  if(pendDeposito > op && pendDeposito>0){
    alerts.push({level:'amber', text:`As casas estão pedindo ${fmt(pendDeposito)} em depósitos, mais do que os ${fmt(op)} disponíveis na conta operacional.`});
  }
  const staleCount = state.houses.filter(h=>h.status!=='encerrada' && daysSince(h.verificadoEm)>90).length;
  if(staleCount > 15){
    alerts.push({level:'amber', text:`${staleCount} casas sem verificar há mais de 90 dias.`});
  }
  const chegando = proximosRecorrentes(3).filter(r => r.tipo === 'saida');
  if(chegando.length){
    alerts.push({level:'amber', text: chegando.map(r =>
      `${escHtml(r.nome)} (${r.variavel?'~':''}${fmt(paraNumero(r.valor))}) ${r.faltam===0?'vence hoje':r.faltam===1?'vence amanhã':`vence em ${r.faltam} dias`}`
    ).join(' · ')});
  }
  const atrasados = aReceberAtrasados();
  if(atrasados.length){
    const soma = atrasados.reduce((s,r)=> s + paraNumero(r.valor), 0);
    alerts.push({level:'amber', text:
      `${fmt(soma)} a receber em atraso: ${atrasados.map(r=>escHtml(r.nome)).join(', ')}. ` +
      `<a href="#" onclick="event.preventDefault();editarAReceber()" style="color:var(--teal)">ver</a>`});
  }
  const vencendo = proximosVencimentos(3);
  if(vencendo.length){
    alerts.push({level:'amber', text: vencendo.map(a =>
      `${escHtml(a.nome)} (${fmt(paraNumero(a.valor))}) vence ${a.faltam===0?'hoje':a.faltam===1?'amanhã':`em ${a.faltam} dias`}`).join(' · ')});
  }
  const ultConc = state.settings.ultimaConciliacao;
  const diasConc = ultConc ? daysSince(ultConc) : null;
  if(diasConc === null || diasConc >= 30){
    alerts.push({level:'amber', text: diasConc === null
      ? 'Os aportes e retornos dos perfis nunca foram lançados — sem isso não dá pra saber quanto do seu capital está em cada CPF. <a href="#" onclick="event.preventDefault();abrirConciliacao()" style="color:var(--teal)">lançar agora</a>'
      : `Aportes e retornos sem atualizar há ${diasConc} dias. <a href="#" onclick="event.preventDefault();abrirConciliacao()" style="color:var(--teal)">atualizar</a>`});
  }
  const dBackup = diasDesdeBackup();
  if(dBackup === null || dBackup > 45){
    alerts.push({level:'amber', text: dBackup === null
      ? 'Nenhum backup do painel foi baixado ainda. Configurações → Backup.'
      : `Último backup do painel foi há ${dBackup} dias. Configurações → Backup.`});
  }
  const semLink = state.houses.filter(h => tipoCasa(h)==='sem_link');
  if(semLink.length){
    alerts.push({level:'amber', text:`${semLink.length} casa(s) sem link cadastrado (${semLink.slice(0,3).map(h=>escHtml(h.nome)).join(', ')}${semLink.length>3?'…':''}) — o saldos.py não consegue abrir e elas ficam fora da varredura. <a href="#" onclick="event.preventDefault();abrirCasasSemLink()" style="color:var(--teal)">corrigir</a>`});
  }
  const paradas = state.houses.filter(h => {
    if(tipoCasa(h) !== 'ativa') return false;
    const hist = Array.isArray(h.historico) ? h.historico : [];
    if(hist.length < 3) return false;
    const ults = hist.slice(-3).map(p => Number(p.saldo)||0);
    return ults.every(v => Math.abs(v - ults[0]) < 0.005) && ults[0] > 0;
  });
  if(paradas.length >= 3){
    alerts.push({level:'amber', text:`${paradas.length} casa(s) com o mesmo saldo há 3 varreduras seguidas — dinheiro parado que talvez valha sacar.`});
  }
  if(provisionSaldo() <= 0 && state.pjHistory.length > 0){
    alerts.push({level:'amber', text:'Saldo de provisionamento zerado, mesmo já havendo fechamentos registrados.'});
  }
  return alerts;
}

  if(!fechamentoDoMesAtual() && (now.getDate() - diaFech) >= 0){

  }

  if(diasConc === null || diasConc >= 30){
    t.push({ prio:3, icone:'⇄', texto:'Lançar aportes e retornos dos perfis',
             acao:'abrirConciliacao()', botao:'lançar' });
  }
  const vencendo = proximosVencimentos(1);
  if(vencendo.length){
    t.push({ prio:1, icone:'💸',
             texto:`Pagar ${vencendo.map(a=>escHtml(a.nome)).join(', ')} (${fmt(vencendo.reduce((s,a)=>s+paraNumero(a.valor),0))})`,
             acao:"goTab('config')", botao:'ver' });
  }
  const atrasadosRec = aReceberAtrasados();
  if(atrasadosRec.length){
    t.push({ prio:2, icone:'↩',
             texto:`Cobrar ${fmt(atrasadosRec.reduce((s,r)=>s+paraNumero(r.valor),0))} de ${atrasadosRec.map(r=>escHtml(r.nome)).join(', ')}`,
             acao:'editarAReceber()', botao:'ver' });
  }
  const semLink = state.houses.filter(h => tipoCasa(h)==='sem_link').length;
  if(semLink){
    t.push({ prio:4, icone:'🔗', texto:`${semLink} casa(s) sem link ficam fora da varredura`,
             acao:'abrirCasasSemLink()', botao:'corrigir' });
  }
  const paradas = contasParadas(45).length;
  if(paradas >= 3){
    t.push({ prio:5, icone:'💤', texto:`${paradas} conta(s) paradas há mais de 45 dias — gire um pouco`,
             acao:"goTab('banca')", botao:'ver casas' });
  }
  const dBackup = state.settings.ultimoBackup ? daysSince(state.settings.ultimoBackup) : null;
  if(dBackup === null || dBackup > 45){
    t.push({ prio:6, icone:'💾', texto:'Baixar um backup do painel',
             acao:'baixarBackup()', botao:'baixar' });
  }
  return t.sort((a,b) => a.prio - b.prio).slice(0,4);
}

  const c = {todas: state.houses.length, depositar:0, sacar:0, observar:0, encerrada:0};
  state.houses.forEach(h => { c[houseStatus(h)] = (c[houseStatus(h)]||0)+1; });
  return c;
}
function setBancaFilter(f){ bancaFilter = f; updateBancaView(); }
function onBancaSearch(v){ bancaSearch = v; updateBancaView(); }
const STATUS_PRIORITY = {depositar:0, sacar:1, observar:2, ok:3, encerrada:4};
let bancaSort = {key:'status', dir:'desc'};   // maiores saques primeiro
const BANCA_COLUMNS = [
  {key:'nome', label:'Casa'},
  {key:'usuario', label:'Usuário'},
  {key:'saldo', label:'Saldo', num:true},
  {key:'deixar', label:'Deixar', num:true},
  {key:'status', label:'Status (valor)', num:true}
];
// Quanto falta ou sobra em relação à meta. Positivo = dá pra sacar,
// negativo = precisa depositar.
function excedenteCasa(h){
  return paraNumero(h.saldo) - paraNumero(h.deixar);
}
function sortValueHouse(h, key){
  if(key==='nome') return h.nome.toLowerCase();
  if(key==='usuario') return (h.usuario||'').toLowerCase();
  // Ordenar Status alfabeticamente não servia pra nada: o que interessa é
  // QUANTO tem pra sacar ou depositar, pra atacar as maiores primeiro.
  if(key==='status') return excedenteCasa(h);
  return Number(h[key])||0;
}
function setBancaSort(key){
  if(bancaSort.key===key) bancaSort.dir = bancaSort.dir==='asc' ? 'desc' : 'asc';
  else { bancaSort.key = key; bancaSort.dir = (key==='nome'||key==='status'||key==='usuario') ? 'asc' : 'desc'; }
  updateBancaView();
}
function getFilteredHouses(){
  const term = bancaSearch.trim().toLowerCase();
  return state.houses
    .filter(h => bancaFilter==='todas' ? true : houseStatus(h)===bancaFilter)
    .filter(h => !term || h.nome.toLowerCase().includes(term) || (h.usuario||'').toLowerCase().includes(term))
    .sort((a,b) => {
      const va = sortValueHouse(a, bancaSort.key), vb = sortValueHouse(b, bancaSort.key);
      let cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
      if(bancaSort.dir === 'desc') cmp = -cmp;
      if(cmp !== 0) return cmp;
      return a.nome.localeCompare(b.nome);
    });
}
function updateBancaView(){

  const tbodyEl = document.getElementById('banca-tbody');

  }).join(' ');

  if(theadEl){
    theadEl.innerHTML = '<tr>' + BANCA_COLUMNS.map(col => {
      const active = bancaSort.key===col.key;

      return `<th class="${col.num?'num':''}" style="cursor:pointer;user-select:none;${active?'color:var(--text)':''}" onclick="setBancaSort('${col.key}')">${col.label}${arrow}</th>`;
    }).join('') + '<th style="text-align:center">Link</th><th></th></tr>';
  }

  tbodyEl.innerHTML = list.length ? list.map(h => {
    const status = houseStatus(h);

    return `

      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:${status==='depositar'?'var(--amber)':status==='sacar'?'var(--teal)':status==='observar'?'var(--coral)':status==='encerrada'?'var(--red)':'var(--text-faint)'}"></span>
          <div>${escHtml(h.nome)}</div>

      </td>
      <td>${h.usuario ? escHtml(h.usuario) : '<span style="color:var(--text-faint)">—</span>'}</td>
      <td class="num">${fmt(h.saldo)}</td>
      <td class="num">${fmt(h.deixar)}</td>
      <td>${statusBadgeHtml(status, h)} ${stale ? `<span class="badge badge-gray" title="${h.verificadoEm ? `Sem verificar há ${daysSince(h.verificadoEm)} dias` : 'Nunca verificada'}">⏱</span>` : ''}${tipoCasa(h)==='sem_link' ? '<span class="badge badge-gray" title="Sem link — o saldos.py não consegue abrir">🔗</span>' : ''}${tipoCasa(h)==='nova' ? '<span class="badge badge-amber" title="Ainda não verificada pelo saldos.py">🆕</span>' : ''}${h.limitada ? `<span class="badge badge-amber" title="Conta limitada${stakeAceito(h)?' — aceita até '+fmt(stakeAceito(h)):''}">🔒</span>` : ''}${h.verificarSaldo===false ? '<span class="badge badge-gray" title="Fora da varredura do saldos.py">🚫</span>' : ''}</td>
      <td style="text-align:center">${h.link ? `<a class="link-icon" href="${escAttr(h.link)}" target="_blank" onclick="event.stopPropagation()" title="Abrir casa">↗</a>` : '—'}</td>
      <td style="text-align:right;white-space:nowrap;"><span class="btn-ghost btn-sm" onclick="event.stopPropagation(); movimentarCasaRapido('${h.id}')" title="Registrar depósito ou saque">⇄</span><span class="btn-ghost btn-sm" onclick="event.stopPropagation(); deleteHouse('${h.id}')" title="Remover">✕</span></td>
    </tr>`;
  }).join('') : `<tr><td colspan="8"><div class="empty">Nenhuma casa encontrada com esse filtro.</div></td></tr>`;
}

function escHtml(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---------- usuários / perfis (integração com o saldos.py) ----------
// O campo `usuario` vazio é você. Cada usuário aqui corresponde a
// um perfil do Opera lá no saldos.py.
// Um perfil é identificado por uma CHAVE, não pelo texto exato do campo:
// '' e o seu nome são a mesma pessoa; 'Mae'/'Mãe' também, via aliases.
// Sem isso o mesmo dono aparecia duas vezes e o saldos.py não achava as casas.
const DONO = 'voce';    // como você aparece: campo `usuario` vazio = você
function chaveUsuario(u){
  const t = (u||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                   .replace(/\s+/g,' ').trim().toLowerCase();
  if(t === '' || t === 'eu' || t === DONO) return 'dono';
  const aliases = {};   // apelidos: { 'apelido':'nome canônico' }
  return aliases[t] || t;
}
function usuariosConhecidos(){
  const mapa = new Map();
  state.houses.forEach(h => {
    const chave = chaveUsuario(h.usuario);
    if(!mapa.has(chave)) mapa.set(chave, { chave, nome:'', casas:[] });
    const grupo = mapa.get(chave);
    if(!grupo.nome && (h.usuario||'').trim()) grupo.nome = h.usuario.trim();
    grupo.casas.push(h);
  });
  Object.keys((state.settings && state.settings.operaPortas) || {}).forEach(nome => {
    const chave = chaveUsuario(nome);
    if(!mapa.has(chave)) mapa.set(chave, { chave, nome, casas:[] });
  });
  if(!mapa.has('dono')) mapa.set('dono', { chave:'dono', nome:'Você', casas:[] });
  mapa.forEach(g => { if(!g.nome) g.nome = g.chave === 'dono' ? 'Você' : g.chave; });
  return [...mapa.values()].sort((a,b) =>
    a.chave === 'dono' ? -1 : b.chave === 'dono' ? 1 : a.nome.localeCompare(b.nome));
}
function nomePerfil(usuario){
  const chave = chaveUsuario(usuario);
  const achado = usuariosConhecidos().find(p => p.chave === chave);
  return achado ? achado.nome : (usuario || 'Você');
}
function selectUsuarioHtml(prefixo, atual){
  const chaveAtual = chaveUsuario(atual);
  const opcoes = usuariosConhecidos().map(p =>
    `<option value="${escAttr(p.nome)}" ${p.chave === chaveAtual ? 'selected' : ''}>${escHtml(p.nome)}${p.chave==='dono'?' (você)':''}</option>`
  ).join('');
  return `
    <select id="${prefixo}-usuario" onchange="toggleNovoUsuario('${prefixo}')">
      ${opcoes}
      <option value="__novo__">➕ Outro usuário…</option>
    </select>
    <input id="${prefixo}-usuario-novo" style="display:none;margin-top:6px;" placeholder="Nome do novo usuário (ex: Nathalia)">`;
}
function toggleNovoUsuario(prefixo){
  const sel = document.getElementById(prefixo+'-usuario');
  const inp = document.getElementById(prefixo+'-usuario-novo');
  const novo = sel.value === '__novo__';
  inp.style.display = novo ? 'block' : 'none';
  if(novo) inp.focus();
}
function valorUsuario(prefixo){
  const sel = document.getElementById(prefixo+'-usuario');
  if(!sel) return '';
  if(sel.value === '__novo__'){
    return (document.getElementById(prefixo+'-usuario-novo').value || '').trim();
  }
  return sel.value;
}
function dominioDe(link){
  try{ return new URL(link).hostname.replace(/^www\./,'').toLowerCase(); }
  catch(e){ return ''; }
}
// mesma classificação usada pelo saldos.py para decidir o que varrer
function tipoCasa(h){
  if((h.status||'ativa') === 'encerrada') return 'encerrada';
  if(!(h.link||'').trim()) return 'sem_link';
  if(h.verificarSaldo === false) return 'excluida';
  if(h.novaCasa || !h.verificadoEm) return 'nova';
  if(Math.abs(paraNumero(h.saldo)) < 0.005) return 'zerada';
  return 'ativa';
}
function escAttr(s){ return (s||'').replace(/"/g, '&quot;'); }

function recordHouseHistory(h){
  if(!Array.isArray(h.historico)) h.historico = [];
  const today = hojeLocal();
  const last = h.historico[h.historico.length-1];
  if(last && last.data === today){ last.saldo = h.saldo; }
  else { h.historico.push({data:today, saldo:h.saldo}); }
  if(h.historico.length > 24) h.historico.shift();
}
function deleteHouse(id){
  if(!confirm('Remover essa casa da lista?')) return;
  state.houses = state.houses.filter(h=>h.id!==id);
  saveState();
  closeModal();

}

function submitEditHouse(id){
  const h = state.houses.find(x=>x.id===id);
  if(!h) return;
  h.nome = document.getElementById('eh-nome').value.trim() || h.nome;
  h.usuario = valorUsuario('eh');
  h.verificarSaldo = document.getElementById('eh-verificar').checked;
  const eraLimitada = !!h.limitada;
  h.limitada = document.getElementById('eh-limitada').checked;
  h.stakeMax = paraNumero(document.getElementById('eh-stake').value);
  h.limitadaEm = document.getElementById('eh-limitada-em').value
    || (h.limitada && !eraLimitada ? hojeLocal() : (h.limitada ? h.limitadaEm : ''));
  if(h.verificadoEm) h.novaCasa = false;
  h.saldo = Number(document.getElementById('eh-saldo').value)||0;
  h.deixar = Number(document.getElementById('eh-deixar').value)||0;
  const todos = document.getElementById('eh-deixar-todos');
  if(todos && todos.checked){
    const chave = chaveApelido(h.nome);
    let n = 0;
    state.houses.forEach(x => {
      if(x.id !== h.id && chaveApelido(x.nome) === chave && (x.status||'ativa') !== 'encerrada'){
        x.deixar = h.deixar; n++;
      }
    });
    if(n) setTimeout(() => showToast(`"Deixar" de ${fmt(h.deixar)} aplicado em mais ${n} ${escHtml(h.nome)}.`), 60);
  }
  h.link = document.getElementById('eh-link').value.trim();
  h.status = document.getElementById('eh-status').value;
  h.verificadoEm = document.getElementById('eh-verificado').value;

// ---------- IMPORTAR PLANILHA ----------
function findColIndex(headerRow, keywords){
  for(let i=0;i<headerRow.length;i++){
    const cell = (headerRow[i]||'').toString().toLowerCase().trim();
    if(!cell) continue;
    if(keywords.some(k => cell.includes(k))) return i;
  }
  return -1;
}
function parseCasaUsuario(raw){
  const m = String(raw||'').trim().match(/^(.*?)\s*-\s*(.+)$/);
  if(m) return { nome: m[1].trim(), usuario: m[2].trim() };
  return { nome: String(raw||'').trim(), usuario: '' };
}
function handleImportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheetName = wb.SheetNames.find(n => /casa/i.test(n)) || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
      const headerRowIndex = rows.findIndex(r => findColIndex(r, ['casa']) !== -1);
      if(headerRowIndex === -1){ showToast('Não achei uma coluna "casas" na planilha.'); return; }
      const header = rows[headerRowIndex];
      const colCasa = findColIndex(header, ['casa']);
      const colSaldo = findColIndex(header, ['quantia','saldo']);
      const colRolando = findColIndex(header, ['rolando']);
      const colLink = findColIndex(header, ['link']);
      const colDeixar = findColIndex(header, ['deixar']);
      const colUsuario = findColIndex(header, ['usuario','usuário','titular']);
      const parsed = [];
      for(let i=headerRowIndex+1;i<rows.length;i++){
        const r = rows[i];
        const rawCasa = r[colCasa];
        if(!rawCasa || String(rawCasa).trim()==='') continue;
        let {nome, usuario} = parseCasaUsuario(rawCasa);
        // se a planilha tem coluna própria de usuário, ela manda
        if(colUsuario >= 0){
          const u = String(r[colUsuario]||'').trim();
          if(u){ nome = String(rawCasa).trim(); usuario = u; }
        }
        const saldo = Number(r[colSaldo])||0;
        const rolando = Number(r[colRolando])||0;
        const deixar = Number(r[colDeixar])||0;
        const link = colLink>=0 ? String(r[colLink]||'').trim() : '';
        parsed.push({ nome, usuario, saldo, rolando, deixar, link });
      }
      if(parsed.length===0){ showToast('Nenhuma linha de casa encontrada na planilha.'); return; }
      window.__pendingImport = parsed;
      openImportPreviewModal(parsed);
    }catch(err){
      showToast('Não consegui ler esse arquivo.');
    }
  };
  reader.readAsArrayBuffer(file);
  evt.target.value = '';
}
function openImportPreviewModal(parsed){
  openModal(`
    <h3>Importar ${parsed.length} casa(s)</h3>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:6px;">Como você quer aplicar esses dados às casas já cadastradas?</p>
    <p style="font-size:12px;color:var(--text-faint);margin-bottom:14px;">${parsed.filter(p=>!p.saldo&&!p.deixar).length} delas estão zeradas (saldo e deixar em 0) e serão cadastradas mesmo assim.</p>
    <div class="field">
      <button class="btn btn-primary" style="width:100%;margin-bottom:8px;justify-content:center;" onclick="applyImport('merge')">Atualizar existentes e adicionar novas</button>
      <button class="btn btn-danger" style="width:100%;justify-content:center;" onclick="applyImport('replace')">Substituir toda a lista de casas</button>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button></div>
  `);
}
function applyImport(mode){
  const parsed = window.__pendingImport || [];
  if(mode==='replace'){
    state.houses = parsed.map(p => ({ id: uid(), nome: p.nome, usuario: p.usuario, saldo: p.saldo, rolando: p.rolando, deixar: p.deixar, link: p.link, status:'ativa', verificadoEm: hojeLocal(), notas:'' }));
  } else {
    parsed.forEach(p => {
      const existing = state.houses.find(h => h.nome.toLowerCase()===p.nome.toLowerCase() && (h.usuario||'').toLowerCase()===(p.usuario||'').toLowerCase());
      if(existing){
        existing.saldo = p.saldo; existing.rolando = p.rolando; existing.deixar = p.deixar;
        recordHouseHistory(existing);
        existing.verificadoEm = hojeLocal();
        if(p.link) existing.link = p.link;
      } else {
        state.houses.push({ id: uid(), nome: p.nome, usuario: p.usuario, saldo: p.saldo, rolando: p.rolando, deixar: p.deixar, link: p.link, status:'ativa', verificadoEm: hojeLocal(), notas:'' });
      }
    });
  }
  window.__pendingImport = null;
  saveState();
  closeModal();
  renderMain();
  showToast('Importação concluída — casas atualizadas marcadas como verificadas hoje.');
}

// Soma o resultado real de todas as casas dentro do mês do fechamento —
// já descontando depósitos e somando saques, então saque no meio do caminho
// não distorce o número.
function lucroCalculadoDoMes(mes, ano){
  const i = MESES.indexOf(mes);
  if(i < 0) return null;
  const de = `${ano}-${String(i+1).padStart(2,'0')}-01`;
  const ate = `${ano}-${String(i+1).padStart(2,'0')}-${String(new Date(Number(ano), i+1, 0).getDate()).padStart(2,'0')}`;
  const detalhes = [];
  let total = 0, semDado = 0;
  state.houses.filter(h => (h.status||'ativa') !== 'encerrada').forEach(h => {
    const hist = (Array.isArray(h.historico)?h.historico:[]).filter(p => p.data >= de && p.data <= ate);
    if(hist.length < 2){ if(paraNumero(h.saldo) > 0) semDado++; return; }
    const dif = paraNumero(hist[hist.length-1].saldo) - paraNumero(hist[0].saldo);
    const f = fluxoCasaNoPeriodo(h.id, hist[0].data, hist[hist.length-1].data);
    const resultado = dif - f.depositos + f.saques;
    if(Math.abs(resultado) > 0.005) detalhes.push({ nome: h.nome, usuario: h.usuario, resultado });
    total += resultado;
  });
  detalhes.sort((a,b) => b.resultado - a.resultado);
  return { total, detalhes, semDado, de, ate };
}
// O Shark Track sabe o resultado de aposta LIQUIDADA, por período — é o
// número certo do lucro bruto. A variação de saldo das varreduras é uma
// estimativa; serve para conferir. Quando os dois divergem muito, é sinal
// de aposta não registrada no tracker ou de Pix ainda não conciliado.
function sharkPorMes(){
  if(!state.settings.sharkPorMes) state.settings.sharkPorMes = {};
  return state.settings.sharkPorMes;
}
function chaveMes(mes, ano){
  const i = MESES.indexOf(mes);
  return i < 0 ? null : `${ano}-${String(i+1).padStart(2,'0')}`;
}
function abrirLucroCalculado(){

  openModal(`

    <div class="note-box" style="margin:10px 0;">
      <strong>Fonte principal: Shark Track</strong><br>
      No Shark Track → Financeiro, filtre o período <strong>01/${String(MESES.indexOf(mes)+1).padStart(2,'0')}/${ano} até o fim do mês</strong>
      e copie o card <em>Resultado de Apostas</em>. É aposta liquidada, não estimativa.
    </div>

    <div class="grid grid-2">
      <div class="field"><label>Resultado de Apostas (bruto)</label><input id="sk-resultado" type="number" step="0.01" value="${salvo.resultado ?? ''}" placeholder="14347,23"></div>
      <div class="field"><label>Apostas Pendentes (opcional)</label><input id="sk-pendentes" type="number" step="0.01" value="${salvo.pendentes ?? ''}" placeholder="17183,68"></div>
    </div>
    <p class="card-note">Esse número é <strong>bruto</strong>. Os custos do ambiente (proxy, ferramentas, contas) já entram no campo de despesas — o líquido sai da conta do fechamento.</p>

    <div style="margin-top:16px;">
      <p class="card-title">Conferência pelas varreduras</p>
      <p class="card-note">Variação de saldo das casas, descontando depósitos e somando saques.${r && r.semDado?` ${r.semDado} casa(s) ficaram de fora por não terem duas leituras.`:''}</p>
      <p class="card-num ${r && r.total>=0?'tag-teal':'tag-coral'}" style="margin:6px 0;">${r ? (r.total>=0?'+':'−')+fmt(Math.abs(r.total)) : '—'}</p>
      <div style="max-height:180px;overflow:auto;">${detalhe}</div>
      ${r && r.detalhes.length ? `<button class="btn btn-sm" style="margin-top:8px;" onclick="usarLucroCalculado(${r.total.toFixed(2)})">usar este em vez do Shark Track</button>` : ''}
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
