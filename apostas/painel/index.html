function usarLucroShark(chave){
  const resultado = paraNumero(document.getElementById('sk-resultado').value);
  if(!resultado){ showToast('Preencha o Resultado de Apostas do Shark Track.'); return; }
  const pendentes = paraNumero(document.getElementById('sk-pendentes').value);
  sharkPorMes()[chave] = { resultado, pendentes, anotadoEm: hojeLocal() };
  if(pendentes) state.settings.pendentesShark = pendentes;   // vira a linha única da banca
  const campo = document.getElementById('pj-lucro');
  if(campo){ campo.value = resultado.toFixed(2); campo.dispatchEvent(new Event('input')); }
  saveState();
  closeModal();
  showToast(`Lucro bruto preenchido.${pendentes?` Apostas em aberto atualizadas para ${fmt(pendentes)}.`:''}`);
}
function usarLucroCalculado(valor){
  const campo = document.getElementById('pj-lucro');
  if(campo){ campo.value = Number(valor).toFixed(2); campo.dispatchEvent(new Event('input')); }
  closeModal();
  showToast('Lucro preenchido. Confira antes de fechar — vale conferir contra o extrato.');
}
function computePJPreview(){
  const lucro = Number(document.getElementById('pj-lucro')?.value)||0;
  const mei = Number(document.getElementById('pj-mei')?.value)||0;
  const despesas = Number(document.getElementById('pj-despesas')?.value)||0;
  const lucroOperacional = lucro + mei - despesas;
  const base = Math.max(lucroOperacional, 0);
  const provIRPF = base * (state.settings.percentIRPF/100);
  const provScam = base * (state.settings.percentScam/100);
  const lucroLiquido = lucroOperacional - provIRPF - provScam;
  const media6 = state.pjHistory.length ? mediaLucroLiquido(6) : lucroLiquido;
  const retirada = media6 * (state.settings.percentRetirada/100);
  const saldoRetido = lucroLiquido - retirada;
  return {lucroOperacional, provIRPF, provScam, lucroLiquido, retirada, saldoRetido, media6};
}
function wirePJPreview(){
  const update = () => {
    const p = computePJPreview();
    const el = document.getElementById('pj-preview');
    if(!el) return;
    el.innerHTML = `
      <div class="preview-item"><div class="lbl">Lucro operacional</div><div class="val">${fmt(p.lucroOperacional)}</div></div>
      <div class="preview-item"><div class="lbl">Prov. IRPF (${state.settings.percentIRPF}%)</div><div class="val tag-teal">${fmt(p.provIRPF)}</div></div>
      <div class="preview-item"><div class="lbl">Prov. anti-scam (${state.settings.percentScam}%)</div><div class="val tag-teal">${fmt(p.provScam)}</div></div>
      <div class="preview-item"><div class="lbl">Retirada sugerida</div><div class="val tag-coral">${fmt(p.retirada)}</div></div>
      <div class="preview-item"><div class="lbl">Lucro líquido PJ</div><div class="val">${fmt(p.lucroLiquido)}</div></div>
      <div class="preview-item"><div class="lbl">Fica retido na operação</div><div class="val">${fmt(p.saldoRetido)}</div></div>
      <div class="preview-item"><div class="lbl">Base retirada (méd. 6m)</div><div class="val">${fmt(p.media6)}</div></div>
      <div class="preview-item"><div class="lbl">% retirada sobre média</div><div class="val">${state.settings.percentRetirada}%</div></div>
    `;
  };
  ['pj-lucro','pj-mei','pj-despesas'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', update);
  });
  update();
}
function submitFechamento(){
  const mes = document.getElementById('pj-mes').value;
  const ano = document.getElementById('pj-ano').value;
  // Fechamento duplicado dobra provIRPF e provScam no provisionSaldo() — o
  // painel passaria a achar que tem mais dinheiro guardado para imposto do
  // que realmente tem. Dois cliques no botão bastavam para isso acontecer.
  const jaExiste = (state.pjHistory||[]).some(h => h.mes === mes && String(h.ano) === String(ano));
  if(jaExiste && !confirm(`Já existe um fechamento de ${mes}/${ano}.\n\nSalvar de novo vai somar o provisionamento duas vezes. Continuar mesmo assim?`)) return;
  const p = computePJPreview();
  const entry = {
    id: uid(),
    mes,
    ano,
    lucroApostas: Number(document.getElementById('pj-lucro').value)||0,
    receitaMEI: Number(document.getElementById('pj-mei').value)||0,
    despesas: Number(document.getElementById('pj-despesas').value)||0,
    lucroOperacional: p.lucroOperacional,
    provIRPF: p.provIRPF,
    provScam: p.provScam,
    lucroLiquido: p.lucroLiquido,
    retirada: p.retirada,
    saldoRetido: p.saldoRetido,
    dataFechamento: hojeLocal()   // ISO: o resto do app compara datas assim
  };
  state.pjHistory.push(entry);
  saveState();
  renderMain();
  showToast('Fechamento salvo.');
}
function deleteFechamento(id){
  const alvo = (state.pjHistory||[]).find(h => h.id === id);
  const desc = alvo ? ` de ${alvo.mes}/${alvo.ano}` : '';
  if(!confirm(`Remover o fechamento${desc}?\n\nIsso também tira ${alvo?fmt((alvo.provIRPF||0)+(alvo.provScam||0)):'o valor'} do provisionamento de IRPF e anti-scam.`)) return;
  state.pjHistory = state.pjHistory.filter(h=>h.id!==id);
  saveState();
  renderMain();
}

function marcarRecebido(id){
  const r = aReceber().find(x => x.id === id);

  r.recebidoEm = hojeLocal();
  state.settings.saldoOperacional = paraNumero(state.settings.saldoOperacional) + valor;

// Responde a pergunta do dia 30: tenho X na operacional, quero manter Y de
// giro — o resto vai pra onde, e quanto disso é imposto de verdade?
function planoDistribuicao(){
  const naConta = paraNumero(state.settings.saldoOperacional);
  const giro = paraNumero(state.settings.metaOperacional) || 20000;
  const impostoEstimado = ganhoAnualPorPerfil().reduce((s,l)=> s + l.imposto, 0);
  const jaProvisionado = provisionSaldo();
  const faltaProvisionar = Math.max(0, impostoEstimado - jaProvisionado);
  const excedente = naConta - giro;
  const paraProvisionar = Math.max(0, Math.min(excedente, faltaProvisionar));
  const livre = Math.max(0, excedente - paraProvisionar);
  return { naConta, giro, excedente, impostoEstimado, jaProvisionado,
           faltaProvisionar, paraProvisionar, livre };
}

// ---------- IRPF sobre prêmios, por CPF ----------
// A regra da Lei 14.790/2023: 15% sobre o ganho líquido ANUAL que passar da
// faixa de isenção — e só sobre o EXCEDENTE, não sobre o total. Cada CPF tem
// a sua própria faixa, então provisionar 15% de tudo superestima muito.
function faixaIsencao(){ return paraNumero(state.settings.faixaIsencaoIR) || 28467.20; }
function aliquotaIR(){ return paraNumero(state.settings.percentIRPF) || 15; }

function ganhoAnualPorPerfil(ano){
  const alvo = String(ano || new Date().getFullYear());
  const de = `${alvo}-01-01`, ate = `${alvo}-12-31`;
  const linhas = {};
  usuariosConhecidos().forEach(p => {
    linhas[p.chave] = { nome: p.nome, chave: p.chave, ganho: 0, casas: 0, semDado: 0 };
  });
  state.houses.filter(h => (h.status||'ativa') !== 'encerrada').forEach(h => {
    const l = linhas[chaveUsuario(h.usuario)];
    if(!l) return;
    const hist = (Array.isArray(h.historico)?h.historico:[]).filter(p => p.data >= de && p.data <= ate);
    if(hist.length < 2){ if(paraNumero(h.saldo) > 0) l.semDado++; return; }
    const dif = paraNumero(hist[hist.length-1].saldo) - paraNumero(hist[0].saldo);
    const f = fluxoCasaNoPeriodo(h.id, hist[0].data, hist[hist.length-1].data);
    l.ganho += dif - f.depositos + f.saques;
    l.casas++;
  });
  const faixa = faixaIsencao(), aliq = aliquotaIR()/100;
  return Object.values(linhas).map(l => {
    const excedente = Math.max(0, l.ganho - faixa);
    return { ...l, excedente, imposto: excedente * aliq, tributavel: excedente > 0 };
  }).sort((a,b) => b.ganho - a.ganho);
}

function renderIRCard(){
  const ano = new Date().getFullYear();
  const linhas = ganhoAnualPorPerfil(ano).filter(l => l.casas > 0 || l.ganho !== 0);
  if(!linhas.length) return '';
  const total = linhas.reduce((s,l)=> s + l.imposto, 0);
  const semDado = linhas.reduce((s,l)=> s + l.semDado, 0);
  const faixa = faixaIsencao();

  const corpo = linhas.map(l => {
    const pct = Math.min(100, Math.round(Math.max(0,l.ganho)/faixa*100));
    return `
      <div style="padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;">
        <div style="display:flex;justify-content:space-between;">
          <span>${escHtml(l.nome)} <span style="color:var(--text-faint)">· ${l.casas} casa(s)</span></span>
          <span class="${l.tributavel?'tag-amber':'tag-teal'}">
            ${fmt(l.ganho)}${l.tributavel?` → IR ${fmt(l.imposto)}`:' · isento'}
          </span>
        </div>
        <div class="bar-track" style="margin-top:5px;height:4px;">
          <div class="bar-fill" style="width:${pct}%;background:${l.tributavel?'var(--amber)':'var(--teal)'}"></div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="card">
      <p class="card-title">IRPF sobre prêmios — ${ano}, por CPF</p>
      <p class="card-num ${total>0?'tag-amber':'tag-teal'}">${fmt(total)}</p>
      <p class="card-note">
        Cada CPF tem a própria faixa de isenção de ${fmt(faixa)} ao ano, e os ${aliquotaIR()}%
        incidem só sobre o que <strong>passar</strong> dela — não sobre o ganho todo.
        ${semDado?`${semDado} casa(s) sem histórico suficiente ficaram de fora.`:''}
      </p>
      <div style="margin-top:10px;">${corpo}</div>
      <button class="btn btn-sm" style="margin-top:10px;" onclick="abrirDetalheIR()">como esse número é calculado</button>
    </div>`;
}

function abrirDetalheIR(){
  const ano = new Date().getFullYear();
  const linhas = ganhoAnualPorPerfil(ano);
  const faixa = faixaIsencao(), aliq = aliquotaIR();
  const contas = linhas.filter(l => l.casas > 0).map(l => `
    <div style="padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;">

  openModal(`

      ${fmt(faixa)} — por CPF, e não sobre o ganho inteiro.<br><br>
      Exemplo: ganho de ${fmt(30000)} não paga ${fmt(4500)}. Paga
      ${aliq}% sobre ${fmt(30000-faixa)}, ou seja <strong>${fmt((30000-faixa)*aliq/100)}</strong>.
    </div>

    <div class="note-box amber" style="margin:12px 0;">

      • As casas licenciadas no Brasil <strong>retêm o imposto na fonte</strong>. Se o prêmio já veio
      líquido, esse valor pode já estar pago — o provisionamento vira margem de segurança, não dívida.<br>
      • O número acima é estimado pela variação de saldo das casas, descontando depósitos e saques.
      Não é a apuração oficial: a Receita separa por natureza (esportivas, cassino, fantasy) e a
      compensação de perdas tem regras próprias.<br><br>
      Isto é uma estimativa de planejamento, não cálculo fiscal. Com o volume que você movimenta e
      prêmios em CPFs de terceiros, vale sentar com um contador — inclusive sobre como o repasse
      entre CPFs deve ser tratado.
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Fechar</button></div>
  `);
}

// ---------- capital em nome de terceiros ----------
// O Open Finance só vê as SUAS contas. Como o bet.br exige depósito do mesmo
// CPF, o dinheiro que roda nas casas da Mãe sai da conta dela — invisível
// aqui. O que aparece é o Pix que você manda pra ela (aporte) e o que ela te
// devolve (retorno). Isso não diz qual casa dela deu lucro, mas responde o
// que importa: a operação naquele CPF está devolvendo ou consumindo?
// De-para "nome que aparece no extrato" -> "perfil do painel".
// Preencha com os nomes completos das pessoas cujas contas você administra:
//   { 'maria da silva': 'Mãe', 'joao souza': 'Pai' }
// Também dá pra ensinar pela própria tela de conciliação, sem mexer aqui.
const PESSOAS_PERFIL_PADRAO = {};
function pessoasPerfil(){
  if(!state.settings.pessoasPerfil) state.settings.pessoasPerfil = {...PESSOAS_PERFIL_PADRAO};
  return state.settings.pessoasPerfil;
}
function perfilPorPessoa(descricao){
  const chave = chaveApelido(descricao);
  if(!chave) return null;
  const mapa = pessoasPerfil();
  // casa por pedaço do nome: o extrato traz o nome completo
  for(const [trecho, perfil] of Object.entries(mapa)){
    if(chave.includes(chaveApelido(trecho))) return perfil;
  }
  return null;
}
function capitalPorPerfil(){
  const linhas = {};
  (state.movimentacoes||[]).forEach(mv => {
    if(mv.tipo !== 'aporte_perfil' && mv.tipo !== 'retorno_perfil') return;
    const chave = chaveUsuario(mv.perfil);
    if(!linhas[chave]) linhas[chave] = { nome: nomePerfil(mv.perfil), enviado:0, devolvido:0 };
    if(mv.tipo === 'aporte_perfil') linhas[chave].enviado += Math.abs(paraNumero(mv.valor));
    else linhas[chave].devolvido += Math.abs(paraNumero(mv.valor));
  });
  usuariosConhecidos().forEach(p => {
    if(chaveUsuario(p.nome) === 'dono') return;   // suas próprias casas não têm aporte
    const chave = p.chave;
    if(!linhas[chave]) return;
    linhas[chave].banca = p.casas
      .filter(h => (h.status||'ativa') !== 'encerrada')
      .reduce((s,h)=> s + paraNumero(h.saldo), 0);
  });
  return Object.values(linhas).map(l => {
    const liquido = l.enviado - l.devolvido;      // capital seu ainda lá dentro
    const banca = l.banca || 0;
    return { ...l, liquido, banca, resultado: banca - liquido };
  }).sort((a,b) => b.liquido - a.liquido);
}
function renderCapitalPerfilCard(){
  const linhas = capitalPorPerfil();
  if(!linhas.length) return '';
  const totalLiquido = linhas.reduce((s,l)=> s + l.liquido, 0);
  const corpo = linhas.map(l => `
    <div style="padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;">
      <div style="display:flex;justify-content:space-between;">
        <span><strong>${escHtml(l.nome)}</strong></span>
        <span class="${l.resultado>=0?'tag-teal':'tag-coral'}">${l.resultado>=0?'+':'−'}${fmt(Math.abs(l.resultado))}</span>
      </div>
      <div style="color:var(--text-faint);font-size:11px;margin-top:3px;">
        mandei ${fmt(l.enviado)} · devolveu ${fmt(l.devolvido)} · capital lá ${fmt(l.liquido)} · banca hoje ${fmt(l.banca)}
      </div>
    </div>`).join('');
  return `
    <div class="card">
      <p class="card-title">Capital em nome de terceiros</p>
      <p class="card-num">${fmt(totalLiquido)}</p>
      <p class="card-note">É o que você mandou e ainda não voltou. O número da direita é o resultado: banca que existe hoje menos capital que você colocou.</p>
      <div style="margin-top:10px;">${corpo}</div>
    </div>`;
}

// ---------- conciliação de Pix (Open Finance / MeuAssessor) ----------
// O extrato mostra o nome de quem recebeu/pagou, que quase nunca é igual ao
// nome da casa ("PAGSMILE", "BETESPORTE LTDA", um CNPJ...). Então guardamos
// um de-para: cada apelido que você confirma uma vez é reconhecido sozinho
// da próxima. Depois de dois meses, a conciliação vira um clique.
function apelidosPix(){
  if(!state.settings.aliasesPix) state.settings.aliasesPix = {};
  return state.settings.aliasesPix;
}
function chaveApelido(txt){
  return (txt||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9 ]/gi,' ').replace(/\s+/g,' ').trim().toLowerCase();
}
function casaPorApelido(descricao){
  const chave = chaveApelido(descricao);
  if(!chave) return null;
  const apelidos = apelidosPix();
  if(apelidos[chave]) return state.houses.find(h => h.id === apelidos[chave]) || null;
  // tenta pelo nome da casa aparecer no texto do extrato
  const palavras = chave.split(' ').filter(p => p.length >= 4);
  let melhor = null, melhorNota = 0;
  state.houses.forEach(h => {
    if((h.status||'ativa') === 'encerrada') return;
    const nome = chaveApelido(h.nome);
    if(nome.length < 3) return;
    let nota = 0;
    if(chave.includes(nome)) nota = nome.length * 2;
    else if(palavras.some(p => nome.includes(p) || p.includes(nome))) nota = nome.length;
    if(nota > melhorNota){ melhorNota = nota; melhor = h; }
  });
  return melhorNota >= 6 ? melhor : null;
}
function idTransacao(t){
  return `${t.data}|${Number(t.valor).toFixed(2)}|${chaveApelido(t.descricao).slice(0,40)}`;
}
function transacoesJaImportadas(){
  const set = new Set();
  (state.movimentacoes||[]).forEach(mv => { if(mv.origemExtrato) set.add(mv.origemExtrato); });
  return set;
}
// Lê o texto copiado direto da tela de Transações do MeuAssessor.
// O bloco de cada dia vem assim:
//   QUA 29/07
//   -R$ 2.990,00                        <- total do dia, tem que ser ignorado
//   Pix enviado para Boa Lion S.a
//   APOSTAS E LOTERIA
//   OF
//   −R$ 2.000,00
//   PAGO
// A descrição é a única linha que não é toda maiúscula, e o valor do dia é
// sempre o primeiro depois do cabeçalho de data.
function lerMeuAssessor(texto, anoRef){
  const DIAS = 'SEG|TER|QUA|QUI|SEX|SÁB|SAB|DOM';
  const reData = new RegExp(`(?:^|·\\s)(?:${DIAS})\\s+(\\d{2})/(\\d{2})\\s*$`, 'i');
  const reValor = /^[−+-]?\s*R\$\s*([\d.]+,\d{2})\s*$/;
  const STATUS = /^(PAGO|RECEBIDO|A PAGAR|A RECEBER|ATRASADA|OF)$/i;
  const ano = anoRef || new Date().getFullYear();
  const saida = [];
  let dataAtual = null, pulaTotal = false, descricao = null;

  texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(linha => {
    const m = linha.match(reData);
    if(m){ dataAtual = `${ano}-${m[2]}-${m[1]}`; pulaTotal = true; descricao = null; return; }
    if(STATUS.test(linha)) return;
    const v = linha.match(reValor);
    if(v){
      if(pulaTotal){ pulaTotal = false; return; }
      if(!dataAtual || !descricao) return;
      const valor = paraNumero(v[1]);
      saida.push({ data: dataAtual, valor: /^[−-]/.test(linha) ? -valor : valor, descricao });
      descricao = null;
      return;
    }
    if(linha === linha.toUpperCase() && /[A-ZÀ-Ú]/.test(linha)) return;   // categoria/conta
    descricao = linha;
  });
  return saida;
}

// Aceita o texto do MeuAssessor, CSV (data;valor;descricao) ou JSON
function lerExtrato(texto){
  const limpo = (texto||'').trim();
  if(!limpo) return [];
  // texto colado da tela do MeuAssessor: tem cabeçalho de dia e "R$"
  if(/(SEG|TER|QUA|QUI|SEX|SÁB|SAB|DOM)\s+\d{2}\/\d{2}/i.test(limpo) && /R\$/.test(limpo)){
    const ano = paraNumero(document.getElementById('cc-ano')?.value) || new Date().getFullYear();
    const lido = lerMeuAssessor(limpo, ano);
    if(lido.length) return lido;
  }
  if(limpo.startsWith('[') || limpo.startsWith('{')){
    try{
      const dados = JSON.parse(limpo);
      const lista = Array.isArray(dados) ? dados : (dados.transacoes || dados.items || []);
      return lista.map(t => ({
        data: String(t.data || t.date || t.dataHora || '').slice(0,10),
        valor: Number(String(t.valor ?? t.amount ?? t.value).toString().replace(',','.'))||0,
        descricao: String(t.descricao || t.contraparte || t.nome || t.description || t.merchant || '')
      })).filter(t => t.data && t.valor);
    }catch(e){ return []; }
  }
  const linhas = limpo.split(/\r?\n/).filter(l => l.trim());
  const sep = (linhas[0].match(/;/g)||[]).length >= (linhas[0].match(/,/g)||[]).length ? ';' : ',';
  const saida = [];
  linhas.forEach((linha, i) => {
    const cols = linha.split(sep).map(c => c.trim().replace(/^"|"$/g,''));
    if(cols.length < 3) return;
    if(i === 0 && /data|date/i.test(cols[0])) return;   // cabeçalho
    let data = cols[0];
    const br = data.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
    if(br) data = `${br[3]}-${br[2]}-${br[1]}`;
    data = data.slice(0,10);
    const valor = Number(cols[1].replace(/\./g,'').replace(',','.'))||0;
    const descricao = cols.slice(2).join(' ');
    if(data && valor) saida.push({data, valor, descricao});
  });
  return saida;
}
function abrirConciliacao(){
  openModal(`
    <h3>Aportes e retornos do mês</h3>
    <p class="card-note">
      <strong>Jeito mais fácil:</strong> no MeuAssessor → Transações, escolha o mês,
      selecione a lista com o mouse e copie (Ctrl+A no bloco, Ctrl+C). Cole aqui.
      Também aceita CSV <code>data;valor;descrição</code> ou JSON.
    </p>
    <p class="card-note">Valor negativo = saiu da sua conta (depósito na casa). Positivo = entrou (saque da casa).</p>
    <div class="field" style="max-width:160px;"><label>Ano do extrato</label><input id="cc-ano" type="number" value="${new Date().getFullYear()}"></div>
    <textarea id="cc-texto" rows="9" placeholder="QUA 29/07&#10;-R$ 2.990,00&#10;Pix enviado para Boa Lion S.a&#10;APOSTAS E LOTERIA&#10;OF&#10;−R$ 2.000,00&#10;PAGO" style="width:100%;font-family:Consolas,monospace;font-size:12px;"></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="analisarExtrato()">Analisar</button>
    </div>
  `);
}
let _extratoPendente = [];
function analisarExtrato(){
  const bruto = document.getElementById('cc-texto').value;
  const transacoes = lerExtrato(bruto);
  if(!transacoes.length){ showToast('Não consegui ler nenhuma transação nesse texto.'); return; }
  const jaImportadas = transacoesJaImportadas();
  // Só interessa o que é aporte ou retorno de um dos perfis. Classificar Pix
  // casa a casa era 80 decisões por mês para calcular um número que o Shark
  // Track já entrega pronto — foi retirado de propósito.
  _extratoPendente = transacoes
    .filter(t => !jaImportadas.has(idTransacao(t)))
    .map(t => ({...t, perfil: perfilPorPessoa(t.descricao), casa: null}))
    .map(t => ({...t, usar: !!t.perfil}));
  const repetidas = transacoes.length - _extratoPendente.length;
  if(!_extratoPendente.length){ showToast(`Tudo já conciliado (${repetidas} repetida(s)).`); closeModal(); return; }
  renderConciliacao(repetidas);
}
function renderConciliacao(repetidas){
  const perfis = usuariosConhecidos().filter(p => p.chave !== 'dono');
  const opcoes = perfil => perfis.map(p =>
    `<option value="perfil:${escAttr(p.nome)}" ${perfil===p.nome?'selected':''}>${escAttr(p.nome)}</option>`).join('');

  const reconhecidas = _extratoPendente.filter(t => t.perfil);
  const resto = _extratoPendente.filter(t => !t.perfil);

  const linhas = reconhecidas.map(t => {
    const i = _extratoPendente.indexOf(t);
    return `
      <div style="display:grid;grid-template-columns:66px 96px 1fr 120px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px;">
        <span style="color:var(--text-faint)">${t.data.slice(8,10)}/${t.data.slice(5,7)}</span>
        <span class="${t.valor<0?'tag-coral':'tag-teal'}">${t.valor<0?'−':'+'}${fmt(Math.abs(t.valor))}</span>
        <span>${t.valor<0?'aporte em':'retorno de'} <strong>${escHtml(t.perfil)}</strong>
          <span style="color:var(--text-faint);font-size:11px;"> · ${escHtml(t.descricao.slice(0,30))}</span></span>
        <select onchange="definirCasaExtrato(${i}, this.value)" style="font-size:12px;">
          ${opcoes(t.perfil)}
          <option value="">ignorar</option>
        </select>
      </div>`;
  }).join('') || '<p class="card-note">Nenhum aporte ou retorno dos perfis neste extrato.</p>';

  const totalResto = resto.reduce((s,t)=> s + Math.abs(t.valor), 0);
  const listaResto = resto.map(t => {
    const i = _extratoPendente.indexOf(t);
    return `
      <div style="display:grid;grid-template-columns:66px 96px 1fr 110px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line-soft);font-size:12px;">
        <span style="color:var(--text-faint)">${t.data.slice(8,10)}/${t.data.slice(5,7)}</span>
        <span style="color:var(--text-faint)">${t.valor<0?'−':'+'}${fmt(Math.abs(t.valor))}</span>
        <span style="color:var(--text-faint)">${escHtml(t.descricao.slice(0,40))}</span>
        <select onchange="definirCasaExtrato(${i}, this.value)" style="font-size:11px;">
          <option value="">ignorar</option>
          ${opcoes(null)}
        </select>
      </div>`;
  }).join('');

  openModal(`
    <h3>Aportes e retornos dos perfis</h3>
    <p class="card-note">${reconhecidas.length} lançamento(s) reconhecido(s) sozinho${repetidas?` · ${repetidas} já estavam lançados`:''}. Só confira e lance.</p>
    <div style="margin:12px 0;">${linhas}</div>

    ${resto.length ? `
      <details style="margin-top:10px;">
        <summary style="cursor:pointer;color:var(--text-faint);font-size:12px;">
          ${resto.length} outra(s) transação(ões) — ${fmt(totalResto)} — serão ignoradas. Abrir se alguma for de um perfil.
        </summary>
        <div style="max-height:220px;overflow:auto;margin-top:8px;">${listaResto}</div>
      </details>` : ''}

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="lancarExtrato()">Lançar ${reconhecidas.length ? reconhecidas.length : ''}</button>
    </div>
  `);
}
function definirCasaExtrato(i, valor){
  const item = _extratoPendente[i];
  item.perfil = valor && valor.startsWith('perfil:') ? valor.slice(7) : null;
  item.usar = !!item.perfil;
}
function lancarExtrato(){
  let nPerfil = 0;
  _extratoPendente.forEach(t => {
    // aporte/retorno de perfil: dinheiro que você manda para a pessoa rodar
    // nas casas dela, e o que ela te devolve
    if(t.perfil){
      pessoasPerfil()[chaveApelido(t.descricao)] = t.perfil;
      const saiu = t.valor < 0;
      state.movimentacoes.push({
        id: uid(),
        data: t.data,
        tipo: saiu ? 'aporte_perfil' : 'retorno_perfil',
        perfil: t.perfil,
        usuario: t.perfil,
        valor: saiu ? -Math.abs(t.valor) : Math.abs(t.valor),
        contaOrigem: saiu ? state.settings.instituicaoOperacional : t.perfil,
        contaDestino: saiu ? t.perfil : state.settings.instituicaoOperacional,
        notas: (t.descricao||'').slice(0,80),
        origemExtrato: idTransacao(t)
      });
      nPerfil++;
      return;
    }
  });
  state.settings.ultimaConciliacao = hojeLocal();
  saveState();
  closeModal();
  renderMain();
  showToast(nPerfil ? `${nPerfil} aporte(s)/retorno(s) lançado(s).` : 'Nada lançado.');
}
function renderConciliacaoCard(){
  const ult = state.settings.ultimaConciliacao;
  const dias = ult ? daysSince(ult) : null;
  const atrasado = dias === null || dias >= 30;
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <p class="card-title">Aportes e retornos (mensal)</p>
          <p style="font-size:13px;color:var(--text-dim);margin:0 0 10px;max-width:480px;">
            Lê o extrato e separa só o que você mandou para Mãe, Pai, Angela, Nathalia e Fernanda —
            e o que voltou. O resto é ignorado. É o que mostra se a banca em nome de cada um
            está devolvendo ou consumindo dinheiro seu.
          </p>
        </div>
        <span class="badge ${atrasado?'badge-amber':'badge-teal'}">${
          dias === null ? 'nunca feita' : dias === 0 ? 'hoje' : `há ${dias} dia(s)`}</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="abrirConciliacao()">⇄ Conciliar extrato</button>
    </div>`;
}

// ---------- backup local ----------
// Todo o painel vive em uma linha do Supabase. Um arquivo local é a única
// coisa que te salva de um projeto pausado por inatividade ou de um erro
// de escrita que apague algo sem querer.
function baixarBackup(){
  const pacote = { versao: 1, exportadoEm: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(pacote, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `painel-backup-${hojeLocal()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  state.settings.ultimoBackup = hojeLocal();
  saveState();
  renderMain();
  showToast('Backup baixado.');
}
function restaurarBackup(input){
  const arquivo = input.files && input.files[0];
  input.value = '';
  if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    let novo;
    try{
      const lido = JSON.parse(leitor.result);
      novo = lido && lido.state ? lido.state : lido;
      if(!novo || !Array.isArray(novo.houses)) throw new Error('formato');
    }catch(e){
      showToast('Arquivo inválido — precisa ser um backup do painel.');
      return;
    }
    const resumo = `${novo.houses.length} casa(s), ${(novo.pjHistory||[]).length} fechamento(s), ${(novo.movimentacoes||[]).length} movimentação(ões)`;
    if(!confirm(`Isso substitui TODO o painel atual por: ${resumo}.\n\nO que está no ar agora será perdido. Continuar?`)) return;
    state = novo;
    migrateState();
    saveState();
    renderNav();
    renderMain();
    showToast('Backup restaurado.');
  };
  leitor.readAsText(arquivo);
}
function diasDesdeBackup(){
  const ult = state.settings && state.settings.ultimoBackup;
  return ult ? daysSince(ult) : null;
}
function importarPortasProfiles(input){
  const arquivo = input.files && input.files[0];
  if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const perfis = JSON.parse(leitor.result);
      if(!Array.isArray(perfis)) throw new Error('formato');
      if(!state.settings.operaPortas) state.settings.operaPortas = {};
      let n = 0;
      perfis.forEach(p => {
        const porta = String(p.porta||'').trim();
        if(!porta || porta.startsWith('COLE')) return;
        state.settings.operaPortas[chaveUsuario(p.usuario_painel !== undefined ? p.usuario_painel : p.nome)] = porta;
        n++;
      });
      saveState();
      renderMain();
      showToast(n ? `${n} porta(s) importada(s) do profiles.json.` : 'Nenhuma porta preenchida nesse arquivo.');
    }catch(e){
      showToast('Não consegui ler esse arquivo — precisa ser o profiles.json.');
    }
  };
  leitor.readAsText(arquivo);
  input.value = '';
}
function baixarProfilesJson(){
  const ids = state.settings.operaPortas || {};
  const perfis = usuariosConhecidos().map(p => {
    const casas = p.casas.filter(h => (h.status||'ativa') !== 'encerrada');
    const dominios = [...new Set(casas.map(h => dominioDe(h.link)).filter(Boolean))];
    return {
      nome: p.nome,
      porta: ids[p.chave] || ids[p.nome] || 'COLE_AQUI_A_PORTA_DO_PERFIL',
      usuario_painel: p.nome,
      casas: dominios,
      casas_painel: casas.map(h => ({
        casa_id: h.id, nome: h.nome, link: h.link||'',
        dominio: dominioDe(h.link), saldo_anterior: Number(h.saldo)||0,
        tipo: tipoCasa(h)
      }))
    };
  }).filter(p => p.casas_painel.length);
  const blob = new Blob([JSON.stringify(perfis, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'profiles.json';
  a.click();
  URL.revokeObjectURL(a.href);
  const semId = perfis.filter(p => String(p.porta).startsWith('COLE')).map(p => p.nome);
  showToast(semId.length ? `Baixado — falta a porta do Opera de: ${semId.join(', ')}` : 'profiles.json baixado.');
}
function verCasasForaDaVarredura(){
  const fora = state.houses
    .filter(h => ['zerada','nova','excluida'].includes(tipoCasa(h)))
    .sort((a,b) => (a.usuario||'').localeCompare(b.usuario||'') || a.nome.localeCompare(b.nome));
  const marcas = {zerada:'💤 zerada', nova:'🆕 nova', excluida:'🚫 não verificar'};
  const linhas = fora.map(h => `
    <div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-soft);font-size:13px;">
      <span>${escHtml(h.nome)} <span style="color:var(--text-faint)">· ${escHtml(nomePerfil(h.usuario))}</span></span>
      <span style="color:var(--text-faint);white-space:nowrap;">${marcas[tipoCasa(h)]}</span>
    </div>`).join('') || '<p class="card-note">Nenhuma — todas as casas entram na varredura.</p>';
  openModal(`
    <h3>Fora da varredura do saldos.py (${fora.length})</h3>
    <p class="card-note">Zeradas e novas vêm desmarcadas na tela de seleção, mas você pode incluir na hora. As "não verificar" ficam sempre de fora até você remarcar na casa.</p>
    <div style="max-height:340px;overflow:auto;margin:12px 0;">${linhas}</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Fechar</button></div>
  `);
}
function updateSetting(key, value, numeric){
  state.settings[key] = numeric ? Number(value)||0 : value;
  saveState();
  renderMain();
}
async function resetData(){
  if(!confirm('Isso apaga todas as casas, fechamentos e patrimônio salvos aqui. Confirma?')) return;
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  try{ await saveState(); }catch(e){ await saveState(); }
  // evita o Realtime reidratar com o estado antigo logo depois do reset
  setTimeout(()=>{ renderMain(); }, 400);
  showToast('Dados apagados.');
}
function resetSomenteCasas(){
  if(!confirm('Isso apaga SÓ a lista de casas. Fechamentos, patrimônio e movimentações ficam. Confirma?')) return;
  state.houses = [];
  saveState();
  setTimeout(()=>{ renderMain(); }, 400);
  showToast('Lista de casas apagada.');
}

renderNav();
initAuth();
